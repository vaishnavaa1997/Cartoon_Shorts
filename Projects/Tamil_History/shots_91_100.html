  // Non-destructive Floating Era Chapter Banner (Never wipes 5-Plane background)
  drawFloatingChapterBanner(g, lt, opts) {
    const o = Object.assign({ era: 'FOUNDING OF MADRAS', year: '22 AUGUST 1639 CE', x: 960, y: 128, accent: '#F7B928', t0: 0.25 }, opts || {});
    const p = DK.pop(lt, o.t0, 0.45);
    if (p <= 0.01) return;
    g.save();
    g.translate(o.x, o.y);
    g.scale(p, p);

    // Ornate floating glass-and-brass pill banner
    const w = 780, h = 76;
    g.fillStyle = 'rgba(11, 16, 30, 0.90)';
    g.strokeStyle = o.accent;
    g.lineWidth = 3;
    g.beginPath();
    g.roundRect(-w / 2, -h / 2, w, h, 38);
    g.fill();
    g.stroke();

    // Rotating compass/dial emblem on left
    g.save();
    g.translate(-w / 2 + 44, 0);
    g.rotate(lt * 0.9);
    g.strokeStyle = o.accent;
    g.lineWidth = 2.2;
    g.beginPath();
    g.arc(0, 0, 22, 0, Math.PI * 2);
    g.stroke();
    for (let i = 0; i < 8; i++) {
      const a = (i * Math.PI) / 4;
      g.beginPath();
      g.moveTo(Math.cos(a) * 14, Math.sin(a) * 14);
      g.lineTo(Math.cos(a) * 22, Math.sin(a) * 22);
      g.stroke();
    }
    g.restore();

    // Era & Year Typography

    g.font = '800 15px "Space Mono", monospace';
    g.fillStyle = o.accent;
    g.fillText('CHAPTER CHRONICLE · ' + o.year, 18, -8);

    g.fillStyle = '#FFFFFF';
    g.fillText(o.era, 18, 20);
    g.restore();

            g.lineTo(-5, 0);
            g.lineTo(0, -8);
            g.lineTo(5, 0);
            g.lineTo(12, -5);
            g.lineTo(10, 6);
            g.closePath();
            g.fill();
            g.stroke();
            g.restore();
          }
          g.restore();

    draw(g, lt, gt, u) {

        mouth: 'neutral',
        pose: { preset: 'march', speed: 1.15 },
        t: gt
      });

      THEME.drawChar(g, 'PULI_THEVAR', {
        moveX: [1420, 1045, lt, 4.8],
        y: 945,
        s: 0.92,
        flipX: true,
        prop: 'sword',

        brows: lt >= 2.4 ? 'raised' : 'neutral',
        mouth: 'neutral',
        pose: { preset: 'march', speed: 1.15 },
        t: gt
      });

      // 5. Mid-Shot Micro-Beat (lt = 2.40s): Rapid Counter Card Ticking 01 -> 72 PALAIYAMS
      const countVal = Math.min(72, Math.max(1, Math.floor(DK.key(lt, [[0.3, 1], [2.4, 72], [4.8, 72]], DK.ease.outCubic))));
      const cardPop = DK.pop(lt, 0.35, 0.4);
      if (cardPop > 0.01) {
        g.save();
        g.translate(1590, 290);
        g.scale(cardPop * (lt >= 2.35 && lt <= 2.75 ? 1.08 : 1.0), cardPop * (lt >= 2.35 && lt <= 2.75 ? 1.08 : 1.0));

        x: DK.key(lt, [[0, -25], [2.4, 0], [4.8, 25]], DK.ease.inOutSine),
        y: 0,
        z: 1.05
      };

      DK.fivePlane(g, cam, {
        bgSky: (g) => {
          DK.mood('goldenHour')(g);
          FX.clouds(g, { seed: 100, count: 6, y: 155, h: 140, color: '#FDE68A', a: 0.78, t: gt, speed: 16 });
        },
        bgFar: (g) => {
          FX.storybookHorizon(g, { style: 'fortress', y: 760, seed: 100 });
          FX.hills(g, { seed: 100, y: 760, amp: 95, color: '#4E3B2E' });
        },
        mgBack: (g) => {
          FX.storybookGround(g, 840, { style: 'earthPath', baseCol: '#5B4534', grassCol: '#4B6B3C' });
          // Three distinct local town forts labeled TOWN A, TOWN B, TOWN C
          FX.structure3D(g, 310, 840, 210, 220, { kind: 'stoneFort', color: '#D97706', t: gt });
          FX.structure3D(g, 1020, 840, 210, 220, { kind: 'stoneFort', color: '#7C3AED', t: gt });
          FX.structure3D(g, 1590, 840, 210, 220, { kind: 'stoneFort', color: '#B91C1C', t: gt });

          // Town Signboards
          const towns = [
            { x: 310, label: 'TOWN A (ஊர் A)', col: '#F59E0B' },
            { x: 1020, label: 'TOWN B (ஊர் B)', col: '#A855F7' },
            { x: 1590, label: 'TOWN C (ஊர் C)', col: '#EF4444' }
          ];
          towns.forEach((tw) => {
            g.save();
            g.translate(tw.x, 585);
            g.fillStyle = 'rgba(15, 23, 42, 0.90)';
            g.strokeStyle = tw.col;
            g.lineWidth = 2.5;
            g.beginPath();
            g.roundRect(-95, -20, 190, 40, 10);
            g.fill();
            g.stroke();
            g.fillStyle = '#FFFFFF';
            g.font = '800 15px "Nunito", sans-serif';
            g.textAlign = 'center';
            g.fillText(tw.label, 0, 6);
            g.restore();
          });
        },
        mgHero: (g) => {
          // 1. British Puppet-Master (moveX: 420 -> 725, arriving at charX + 95px behind PALAIYAKKARAR at x: 820)
          THEME.drawChar(g, 'BRITISH_OFFICER', {
            moveX: [420, 725, lt, 4.8],
            y: 840,
            s: 1.0,
            prop: 'scroll',
            eyeMode: 'warm',
            brows: 'asymmetric',
            mouth: 'smile',
            pose: { preset: 'march', speed: 1.25 },
            t: gt
          });

          // 2. Town A Ruler (PALAIYAKKARAR at x: 820) Clashing at Exact charX + 115px Contact with Town B Ruler (CHOLA_KING at x: 935)
          THEME.drawChar(g, 'PALAIYAKKARAR', {
            x: 820,
            y: 840,
            s: 1.02,
            prop: 'sword',
            eyeMode: 'warm',
            brows: 'furrowed',
            mouth: 'scream',
            pose: { preset: 'swordFight', speed: 1.4 },
            t: gt
          });

          THEME.drawChar(g, 'CHOLA_KING', {
            x: 935,
            y: 840,
            s: 1.02,
            flipX: true,
            prop: 'sword',
            eyeMode: 'warm',
            brows: 'furrowed',
            mouth: 'scream',
            pose: { preset: 'swordFight', speed: 1.4 },
            t: gt
          });

          // 3. Town C Ruler (PULI_THEVAR at x: 1380) Watching Next in Line
          THEME.drawChar(g, 'PULI_THEVAR', {
            x: 1380,
            y: 840,
            s: 0.98,
            flipX: true,
            prop: 'sword',
            eyeMode: lt >= 2.4 ? 'panic' : 'warm',
            brows: lt >= 2.4 ? 'raised' : 'neutral',
            mouth: lt >= 2.4 ? 'gasp' : 'neutral',
            pose: { preset: 'think', speed: 1.0 },
            t: gt
          });

          // 4. Mid-Shot Micro-Beat (lt = 2.40s): Tactical Alliance Arrow Flips from [EIC + TOWN A -> TOWN B] to [EIC + TOWN B -> TOWN C]
          const isPhase2 = lt >= 2.40;
          const bannerPop = isPhase2 ? DK.pop(lt, 2.40, 0.35) : DK.pop(lt, 0.35, 0.35);
          g.save();
          g.translate(isPhase2 ? 1150 : 760, 445);
          g.scale(bannerPop, bannerPop);
          g.fillStyle = isPhase2 ? 'rgba(124, 45, 18, 0.95)' : 'rgba(15, 23, 42, 0.94)';
          g.strokeStyle = isPhase2 ? '#FF851B' : '#38BDF8';
          g.lineWidth = 3;
          g.beginPath();
          g.roundRect(-275, -36, 550, 72, 16);
          g.fill();
          g.stroke();

          g.textAlign = 'center';
          g.font = '800 13px "Space Mono", monospace';
          g.fillStyle = isPhase2 ? '#FDE047' : '#38BDF8';
          g.fillText(isPhase2 ? 'ALLIANCE SWITCHED! (DIVIDE & RULE)' : 'TACTICAL ALLIANCE PHASE 01', 0, -10);

          g.font = '900 19px "Fredoka", sans-serif';
          g.fillStyle = '#FFFFFF';
          g.fillText(
            isPhase2 ? 'EIC + TOWN B  ➔  ATTACK TOWN C!' : 'EIC + TOWN A  ➔  CRUSH TOWN B!',
            0,
            18
          );
          g.restore();
        },
        fgBokeh: (g) => {
          FX.bokehOrbs(g, gt, { count: 10, color: 'rgba(255, 133, 27, 0.16)' });
        }
      });

      UI.pillBadge(g, lt, {
        text: 'STEP 1: ALLY WITH "A" TO CRUSH "B" → REPEAT',
        x: 960,
        y: 120,
        accent: '#FF851B',
        t0: 0.3
      });
      UI.citation(g, 'Anglo-Carnatic Wars & Nawab of Arcot Campaigns (1746–1801)', { align: 'left' });
      DK.finishFrame(g, gt, { vignette: 0.26, grain: 0.025 });
    },
    sfx(k, bt0) {
      k.bed('battlefield', bt0 + 0.0, bt0 + 4.8, { gain: 0.22 });
      k.play('swordClash', bt0 + 0.70, { gain: 0.58 });
      k.play('slideWhistleUp', bt0 + 2.40, { gain: 0.45 });
      k.play('swordClash', bt0 + 3.10, { gain: 0.62 });
    }
  }
];

if (window.DK && DK.linkShotTransitions) DK.linkShotTransitions(SHOTS, window.THEME);
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const BATCH_START = SHOTS[0].start;
const BATCH_END = SHOTS[SHOTS.length - 1].end;
const DURATION = BATCH_END - BATCH_START;

// Auto-runs each shot's attached sfx(k, bt0) if scoreSound(k) is not defined separately
if (typeof window.scoreSound !== 'function') {
  window.scoreSound = function scoreSound(k) {
    SHOTS.forEach((s) => {
      if (typeof s.sfx === 'function') s.sfx(k, s.start - BATCH_START);
    });
  };
}
const scoreSound = window.scoreSound;

window.BATCH_START = BATCH_START;
window.BATCH_END = BATCH_END;
window.DURATION = DURATION;
window.SHOTS = SHOTS;
window.scoreSound = scoreSound;

let currentT = 0, playing = false, rafId = null, lastTs = 0, stopSound = null, activeShotFilter = 'all', voAudio = null;

function findShotAtGlobal(gt) {
  for (let i = 0; i < SHOTS.length; i++) {
    if (gt >= SHOTS[i].start && gt <= SHOTS[i].end) return SHOTS[i];
  }
  return gt < SHOTS[0].start ? SHOTS[0] : SHOTS[SHOTS.length - 1];
}

function renderAtLocal(localT) {
  currentT = DK.clamp(localT, 0, DURATION);
  const gt = BATCH_START + currentT;
  const s = findShotAtGlobal(gt);
  const lt = DK.clamp(gt - s.start, 0, s.duration);
  const u = s.duration > 0 ? lt / s.duration : 0;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, 1920, 1080);
  ctx.save();
  if (window.DK && DK.drawShot) DK.drawShot(ctx, s, lt, gt, u);
  else s.draw(ctx, lt, gt, u);
  ctx.restore();
  document.getElementById('scrub').value = DURATION > 0 ? currentT / DURATION : 0;
  document.getElementById('readout').textContent = gt.toFixed(2) + 's (' + currentT.toFixed(2) + 's) · Shot ' + s.shot_number;
}

window.seek = function (t, opts) {
  if (playing) pause();
  const localT = opts && opts.global ? t - BATCH_START : t;
  renderAtLocal(localT);
};

function startAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  const mixMode = document.getElementById('mixSelect').value;
  if (mixMode !== 'mute' && window.SOUND) stopSound = SOUND.live(scoreSound, currentT, { mixMode: 'sfxOnly' });
  if (voAudio) { voAudio.currentTime = BATCH_START + currentT; voAudio.play().catch(() => {}); }
}

function stopAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  if (voAudio) voAudio.pause();
}

function play() {
  if (playing) return;
  playing = true;
  document.getElementById('playBtn').textContent = 'Pause';
  lastTs = performance.now();
  startAudio();
  const tick = (now) => {
    if (!playing) return;
    const dt = (now - lastTs) / 1000;
    lastTs = now;
    let nextT = currentT + dt;
    if (activeShotFilter !== 'all') {
      const s = SHOTS.find((sh) => String(sh.shot_number) === activeShotFilter);
      if (s) {
        const sLocal0 = s.start - BATCH_START, sLocal1 = s.end - BATCH_START;
        if (nextT >= sLocal1) { nextT = sLocal0; currentT = nextT; startAudio(); }
      }
    } else if (nextT >= DURATION) {
      nextT = 0; currentT = 0; startAudio();
    }
    renderAtLocal(nextT);
    rafId = requestAnimationFrame(tick);
  };
  rafId = requestAnimationFrame(tick);
}

function pause() {
  playing = false;
  document.getElementById('playBtn').textContent = 'Play';
  if (rafId) cancelAnimationFrame(rafId);
  stopAudio();
}

const shotSelect = document.getElementById('shotSelect');
SHOTS.forEach((s) => {
  const opt = document.createElement('option');
  opt.value = String(s.shot_number);
  opt.textContent = 'Shot ' + s.shot_number + ': ' + s.title + ' (' + s.start.toFixed(1) + 's-' + s.end.toFixed(1) + 's)';
  shotSelect.appendChild(opt);
});

shotSelect.addEventListener('change', () => {
  activeShotFilter = shotSelect.value;
  if (activeShotFilter !== 'all') {
    const s = SHOTS.find((sh) => String(sh.shot_number) === activeShotFilter);
    if (s) { renderAtLocal(s.start - BATCH_START); if (playing) startAudio(); }
  }
});

document.getElementById('playBtn').addEventListener('click', () => (playing ? pause() : play()));
document.getElementById('scrub').addEventListener('input', (e) => {
  renderAtLocal(parseFloat(e.target.value) * DURATION);
  if (playing) startAudio();
});
document.getElementById('mixSelect').addEventListener('change', () => { if (playing) startAudio(); });
document.getElementById('voInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  voAudio = new Audio(URL.createObjectURL(file));
});
document.getElementById('wavBtn').addEventListener('click', async () => {
  const res = await SOUND.renderOffline(scoreSound, DURATION, 48000, { mixMode: 'sfxOnly' });
  const blob = SOUND.encodeWAV(res.inter, res.sr);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'batch_sfx_' + SHOTS[0].shot_number + '_' + SHOTS[SHOTS.length - 1].shot_number + '.wav';
  a.click();
});
window.addEventListener('DOMContentLoaded', async () => {
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  if (window.MAP && MAP.preloadAll) await MAP.preloadAll(SHOTS);
  renderAtLocal(0);
});
</script>
</body>
</html>
