  // Helper to spawn a clean-shaven character with overrides
  drawChar(g, id, overrides = {}) {
    const base = this.CHARS[id] || this.CHARS.HOST_PROTAG;
    DK.char(g, Object.assign({}, base, overrides, {
      beard: false,
      mustache: false
    }));
  },

  // Custom 2.5D Chola Tiger Banner (புலிக்கொடி) helper
  drawTigerBanner(g, x, y, scale, gt, opts = {}) {
    g.save();
    g.translate(x, y);
    g.scale(scale, scale);
    const unfurl = opts.unfurl !== undefined ? opts.unfurl : 1.0;
    const poleH = opts.poleH || 170;

    // Brass flagpole
    g.strokeStyle = '#D99B26';
    g.lineWidth = 6;
    g.beginPath();
    g.moveTo(0, 0);
    g.lineTo(0, -poleH);
    g.stroke();

    // Finial spearhead
    g.fillStyle = '#FFD54F';
    g.beginPath();
    g.moveTo(0, -poleH - 18);
    g.lineTo(-8, -poleH);
    g.lineTo(8, -poleH);
    g.closePath();
    g.fill();

    if (unfurl > 0.02) {
      const bw = 115 * unfurl;
      const bh = 64;
      const wave1 = Math.sin(gt * 6.5 + (opts.seed || 0)) * 7 * unfurl;
      const wave2 = Math.cos(gt * 5.2 + (opts.seed || 0)) * 9 * unfurl;

      g.fillStyle = opts.bgColor || '#B91C1C';
      g.strokeStyle = '#F7B928';
      g.lineWidth = 3.5;
      g.beginPath();
      g.moveTo(3, -poleH + 6);
      g.bezierCurveTo(bw * 0.4, -poleH + 6 + wave1, bw * 0.75, -poleH + 6 - wave2, bw, -poleH + 12 + wave1);
      g.lineTo(bw - 18, -poleH + 6 + bh * 0.5 + wave2 * 0.5);
      g.lineTo(bw, -poleH + 6 + bh + wave2);
      g.bezierCurveTo(bw * 0.7, -poleH + 6 + bh - wave1, bw * 0.35, -poleH + 6 + bh + wave2, 3, -poleH + 6 + bh);
      g.closePath();
      g.fill();
      g.stroke();

      // Stylized pouncing Chola Tiger emblem in gold
      if (unfurl > 0.45) {
        g.save();
        g.translate(bw * 0.44, -poleH + 38 + wave1 * 0.35);
        g.scale(unfurl, 1);
        g.fillStyle = '#FFD54F';
        // Tiger torso & arched back
        g.beginPath();
        g.ellipse(0, 0, 22, 9, -0.15, 0, Math.PI * 2);
        g.fill();
        // Tiger head
        g.beginPath();
        g.arc(20, -7, 8, 0, Math.PI * 2);
        g.fill();
        // Pouncing forelegs & hindlegs
        g.strokeStyle = '#FFD54F';
        g.lineWidth = 4;
        g.lineCap = 'round';
        g.beginPath();
        g.moveTo(15, -2); g.lineTo(28, -12);
        g.moveTo(12, 4);  g.lineTo(25, 9);
        g.moveTo(-14, 3); g.lineTo(-24, 13);
        g.moveTo(-18, -2); g.lineTo(-30, -14);
        g.stroke();
        // Stripes
        g.strokeStyle = '#7F1D1D';
        g.lineWidth = 2;
        for (let i = -10; i <= 8; i += 6) {
          g.beginPath();
          g.moveTo(i, -6);
          g.lineTo(i - 2, 5);
          g.stroke();
        }
        g.restore();
      }
    }
    g.restore();
  },

  // Custom 2.5D Pandya Twin-Fish Banner (இரட்டை மீன் கொடி)
  drawPandyaBanner(g, x, y, scale, gt, seed = 1) {
    g.save();
    g.translate(x, y);
    g.scale(scale, scale);
    const poleH = 165;
    g.strokeStyle = '#D99B26';
    g.lineWidth = 6;
    g.beginPath();
    g.moveTo(0, 0);
    g.lineTo(0, -poleH);
    g.stroke();

    const bw = 108, bh = 62;
    const wv = Math.sin(gt * 5.5 + seed) * 6;
    g.fillStyle = '#1E40AF';
    g.strokeStyle = '#F7B928';
    g.lineWidth = 3.5;
    g.beginPath();
    g.moveTo(3, -poleH + 6);
    g.quadraticCurveTo(bw * 0.5, -poleH + 6 + wv, bw, -poleH + 10 - wv);
    g.lineTo(bw - 14, -poleH + 6 + bh * 0.5);
    g.lineTo(bw, -poleH + 6 + bh + wv);
    g.quadraticCurveTo(bw * 0.5, -poleH + 6 + bh - wv, 3, -poleH + 6 + bh);
    g.closePath();
    g.fill();
    g.stroke();

    // Twin golden fish emblem
    g.fillStyle = '#FFD54F';
    for (let f = -1; f <= 1; f += 2) {
      g.save();
      g.translate(bw * 0.42 + f * 12, -poleH + 37 + wv * 0.3);
      g.rotate(-0.35 * f);
      g.beginPath();
      g.ellipse(0, 0, 7, 15, 0, 0, Math.PI * 2);
      g.fill();
      g.beginPath();
      g.moveTo(0, 13);
      g.lineTo(-6, 21);
      g.lineTo(6, 21);
      g.closePath();
      g.fill();
      g.restore();
    }
    g.restore();
  },

  // Non-destructive Floating HUD Chapter Dial Banner (Strictly obeys Rule 5: y = 110..175, never full-screen)
  drawEraDialBanner(g, lt, opts = {}) {
    const y = opts.y || 132;
    const t0 = opts.t0 || 0.15;
    const lockTime = opts.lockTime || 1.75;
    const p = DK.pop(lt, t0, 0.45);
    if (p <= 0.01) return;

    const locked = lt >= lockTime;
    const slamPop = locked ? DK.pop(lt, lockTime, 0.28) : 1.0;

    g.save();
    g.translate(960, y);
    g.scale(0.88 + 0.12 * p * (locked ? (0.94 + 0.06 * slamPop) : 1), 0.88 + 0.12 * p);

    // Sleek dark obsidian HUD pill with glowing crimson/gold trim
    const w = 680, h = 76;
    g.fillStyle = locked ? 'rgba(28, 10, 18, 0.94)' : 'rgba(13, 19, 34, 0.90)';
    g.strokeStyle = locked ? '#FF4D6A' : '#F7B928';
    g.lineWidth = locked ? 3.5 : 2.5;
    g.beginPath();
    g.roundRect(-w / 2, -h / 2, w, h, 38);
    g.fill();
    g.stroke();

    // Rotating mechanical chapter dial wheel on left side of pill
    g.save();
    g.translate(-w / 2 + 46, 0);
    const dialAngle = locked ? 0 : (1.75 - lt) * 5.2;
    g.rotate(dialAngle);
    g.strokeStyle = locked ? '#FF4D6A' : '#FFD54F';
    g.lineWidth = 2.5;
    g.beginPath();
    g.arc(0, 0, 24, 0, Math.PI * 2);
    g.stroke();
    for (let i = 0; i < 8; i++) {
      const a = (i * Math.PI) / 4;
      g.beginPath();
      g.moveTo(Math.cos(a) * 16, Math.sin(a) * 16);
      g.lineTo(Math.cos(a) * 24, Math.sin(a) * 24);
      g.stroke();
    }
    g.restore();

    // Era label & Year readout
    g.textAlign = 'left';
    g.textBaseline = 'middle';
    g.font = '800 15px "Space Mono", monospace';
    g.fillStyle = locked ? '#FF94A6' : '#94A3B8';
    g.fillText(opts.era || 'THE TURNING POINT', -w / 2 + 88, -13);

    g.font = '900 28px "Fredoka", sans-serif';
    g.fillStyle = locked ? '#FFFFFF' : '#FFD54F';
    const yearDisplay = locked ? (opts.year || '1311 CE') : (1292 + Math.floor(DK.clamp(lt / lockTime, 0, 1) * 19)) + ' CE';
    g.fillText(yearDisplay + (locked ? ' · INVASION SHOCK' : ''), -w / 2 + 88, 14);

    if (locked) {
      g.textAlign = 'right';
      g.font = '800 14px "Space Mono", monospace';
      g.fillStyle = '#FF4D6A';
      g.fillText('FATE ALTERED', w / 2 - 28, 0);
    }
    g.restore();
  },

  // Low Foreground Terrace for Map & Chart Shots (Strictly obeys Rule 4: y = 980 unobstructed map/chart)
  drawMapForeTerrace(g, gt, opts = {}) {
    const ty = opts.y || 980;
    const style = opts.style || 'flagstone';
    const baseCol = opts.baseCol || '#2A221B';
    const trimCol = opts.trimCol || '#D99B26';

    // Subtle soft shadow under terrace lip
    const grad = g.createLinearGradient(0, ty - 28, 0, 1080);
    grad.addColorStop(0, 'rgba(6, 10, 20, 0.0)');
    grad.addColorStop(0.25, 'rgba(6, 10, 20, 0.85)');
    grad.addColorStop(1, 'rgba(6, 10, 20, 0.98)');
    g.fillStyle = grad;
    g.fillRect(0, ty - 28, 1920, 1080 - (ty - 28));

    FX.storybookGround(g, ty, {
      style: style,
      baseCol: baseCol,
      grassCol: trimCol
    });

    // Ornate carved stone balustrade edge along y = 980
    g.strokeStyle = trimCol;
    g.lineWidth = 3;
    g.beginPath();
    g.moveTo(0, ty);
    g.lineTo(1920, ty);
    g.stroke();
  }
};

            lt,
            gt
          });

          // Overflowing 2.5D Gold, Diamonds & Cat's-Eye Gems on the Treasury Table
          g.save();
          g.translate(910, 745);
          // Gold bars & coins
          g.fillStyle = '#FFD54F';
          g.strokeStyle = '#B45309';
          g.lineWidth = 2;
          for (let i = -3; i <= 3; i++) {
            g.beginPath();
            g.arc(i * 15, 4, 11, 0, Math.PI * 2);
            g.fill();
            g.stroke();
          }
          // Faceted Diamond & Cat's-Eye Gems
          g.fillStyle = '#5CE1FF';
          g.beginPath();
          g.moveTo(-25, -18); g.lineTo(-13, -6); g.lineTo(-25, 6); g.lineTo(-37, -6);
          g.closePath();
          g.fill();

          g.fillStyle = '#38C878';
          g.beginPath();
          g.moveTo(25, -18); g.lineTo(37, -6); g.lineTo(25, 6); g.lineTo(13, -6);
          g.closePath();
          g.fill();
          g.restore();

          // Temple Treasurer (THIRUVALLUVAR) hurrying 460 -> 820 (charX + 90px = 910 chest contact)
          THEME.drawChar(g, 'THIRUVALLUVAR', {
            moveX: [460, 820, lt, 2.8],
            y: 840,
            pose: { preset: 'walk', speed: 1.15 },
            prop: 'palmLeaf',
            eyeMode: 'warm',
            brows: 'raised',
            mouth: lt >= 1.40 ? 'o' : 'neutral',
            t: gt,
            seed: 800
          });

          // Mid-Shot Micro-Beat (lt = 1.40s): 3 Radiant Jewel Callout Badges flare above the coffers
          if (lt >= 1.40) {
            const items = [
              { x: 760, y: 540, label: 'GOLD (தங்கம்)', col: '#FFD54F', delay: 0.0 },
              { x: 1020, y: 485, label: 'DIAMONDS (வைரம்)', col: '#5CE1FF', delay: 0.12 },
              { x: 1280, y: 540, label: 'GEMS (வைடூரியம்)', col: '#38C878', delay: 0.24 }
            ];
            items.forEach((it) => {
              const popP = DK.pop(lt, 1.40 + it.delay, 0.35);
              if (popP > 0.01) {
                g.save();
                g.translate(it.x, it.y);
                g.scale(popP, popP);
                g.fillStyle = 'rgba(17, 24, 39, 0.94)';
                g.strokeStyle = it.col;
                g.lineWidth = 2.5;
                g.beginPath();
                g.roundRect(-115, -22, 230, 44, 22);
                g.fill();
                g.stroke();

                g.fillStyle = it.col;
                g.font = '900 15px "Nunito", sans-serif';
                g.textAlign = 'center';
                g.textBaseline = 'middle';
                g.fillText('✦ ' + it.label, 0, 0);
                g.restore();
              }
            });
          }
        },
        fgBokeh: (g) => {
          FX.bokehOrbs(g, gt, { count: 16, color: 'rgba(255, 215, 80, 0.24)' });
        }
      });

      UI.pillBadge(g, lt, {
        text: 'CENTURIES OF ACCUMULATED TEMPLE WEALTH',
        x: 960,
        y: 120,
        accent: '#F7B928',
        t0: 0.25
      });
      UI.citation(g, 'Amir Khusrau’s Inventory of Ma’bar Treasury Plunder (1311 CE)', { align: 'left' });
      DK.finishFrame(g, gt, { vignette: 0.24, grain: 0.02 });
    },

    sfx(k, bt0) {
      k.bed('templeCourtyard', bt0 + 0.0, bt0 + 2.8, { gain: 0.20 });
      k.play('coinClink', bt0 + 0.45, { gain: 0.50 });
      k.play('starShimmer', bt0 + 1.40, { gain: 0.55 });
      k.play('coinClink', bt0 + 1.85, { gain: 0.52 });
    }
  }
];

window.THEME = THEME;
if (window.DK && DK.linkShotTransitions) DK.linkShotTransitions(SHOTS, window.THEME);
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const BATCH_START = SHOTS[0].start;
const BATCH_END = SHOTS[SHOTS.length - 1].end;
const DURATION = BATCH_END - BATCH_START;

// Auto-runs each shot's attached sfx(k, bt0) if scoreSound(k) is not defined separately
if (typeof window.scoreSound !== 'function') {
  window.scoreSound = function scoreSound(k) {
    SHOTS.forEach((s) => {
      if (typeof s.sfx === 'function') s.sfx(k, s.start - BATCH_START);
    });
  };
}
const scoreSound = window.scoreSound;

window.BATCH_START = BATCH_START;
window.BATCH_END = BATCH_END;
window.DURATION = DURATION;
window.SHOTS = SHOTS;
window.scoreSound = scoreSound;

let currentT = 0, playing = false, rafId = null, lastTs = 0, stopSound = null, activeShotFilter = 'all', voAudio = null;

function findShotAtGlobal(gt) {
  for (let i = 0; i < SHOTS.length; i++) {
    if (gt >= SHOTS[i].start && gt <= SHOTS[i].end) return SHOTS[i];
  }
  return gt < SHOTS[0].start ? SHOTS[0] : SHOTS[SHOTS.length - 1];
}

function renderAtLocal(localT) {
  currentT = DK.clamp(localT, 0, DURATION);
  const gt = BATCH_START + currentT;
  const s = findShotAtGlobal(gt);
  const lt = DK.clamp(gt - s.start, 0, s.duration);
  const u = s.duration > 0 ? lt / s.duration : 0;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, 1920, 1080);
  ctx.save();
  if (window.DK && DK.drawShot) DK.drawShot(ctx, s, lt, gt, u);
  else s.draw(ctx, lt, gt, u);
  ctx.restore();
  document.getElementById('scrub').value = DURATION > 0 ? currentT / DURATION : 0;
  document.getElementById('readout').textContent = gt.toFixed(2) + 's (' + currentT.toFixed(2) + 's) · Shot ' + s.shot_number;
}

window.seek = function (t, opts) {
  if (playing) pause();
  const localT = opts && opts.global ? t - BATCH_START : t;
  renderAtLocal(localT);
};

function startAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  const mixMode = document.getElementById('mixSelect').value;
  if (mixMode !== 'mute' && window.SOUND) stopSound = SOUND.live(scoreSound, currentT, { mixMode: 'sfxOnly' });
  if (voAudio) { voAudio.currentTime = BATCH_START + currentT; voAudio.play().catch(() => {}); }
}

function stopAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  if (voAudio) voAudio.pause();
}

function play() {
  if (playing) return;
  playing = true;
  document.getElementById('playBtn').textContent = 'Pause';
  lastTs = performance.now();
  startAudio();
  const tick = (now) => {
    if (!playing) return;
    const dt = (now - lastTs) / 1000;
    lastTs = now;
    let nextT = currentT + dt;
    if (activeShotFilter !== 'all') {
      const s = SHOTS.find((sh) => String(sh.shot_number) === activeShotFilter);
      if (s) {
        const sLocal0 = s.start - BATCH_START, sLocal1 = s.end - BATCH_START;
        if (nextT >= sLocal1) { nextT = sLocal0; currentT = nextT; startAudio(); }
      }
    } else if (nextT >= DURATION) {
      nextT = 0; currentT = 0; startAudio();
    }
    renderAtLocal(nextT);
    rafId = requestAnimationFrame(tick);
  };
  rafId = requestAnimationFrame(tick);
}

function pause() {
  playing = false;
  document.getElementById('playBtn').textContent = 'Play';
  if (rafId) cancelAnimationFrame(rafId);
  stopAudio();
}

const shotSelect = document.getElementById('shotSelect');
SHOTS.forEach((s) => {
  const opt = document.createElement('option');
  opt.value = String(s.shot_number);
  opt.textContent = 'Shot ' + s.shot_number + ': ' + s.title + ' (' + s.start.toFixed(1) + 's-' + s.end.toFixed(1) + 's)';
  shotSelect.appendChild(opt);
});

shotSelect.addEventListener('change', () => {
  activeShotFilter = shotSelect.value;
  if (activeShotFilter !== 'all') {
    const s = SHOTS.find((sh) => String(sh.shot_number) === activeShotFilter);
    if (s) { renderAtLocal(s.start - BATCH_START); if (playing) startAudio(); }
  }
});

document.getElementById('playBtn').addEventListener('click', () => (playing ? pause() : play()));
document.getElementById('scrub').addEventListener('input', (e) => {
  renderAtLocal(parseFloat(e.target.value) * DURATION);
  if (playing) startAudio();
});
document.getElementById('mixSelect').addEventListener('change', () => { if (playing) startAudio(); });
document.getElementById('voInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  voAudio = new Audio(URL.createObjectURL(file));
});
document.getElementById('wavBtn').addEventListener('click', async () => {
  const res = await SOUND.renderOffline(scoreSound, DURATION, 48000, { mixMode: 'sfxOnly' });
  const blob = SOUND.encodeWAV(res.inter, res.sr);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'batch_sfx_' + SHOTS[0].shot_number + '_' + SHOTS[SHOTS.length - 1].shot_number + '.wav';
  a.click();
});
window.addEventListener('DOMContentLoaded', async () => {
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  if (window.MAP && MAP.preloadAll) await MAP.preloadAll(SHOTS);
  renderAtLocal(0);
});
</script>
</body>
</html>
