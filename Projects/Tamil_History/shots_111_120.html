<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Lumina 2.5D Storybook Studio (16:9) — Shots 111 to 120 (shots_111_120.html)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #05070d; color: #e2e8f0; font-family: 'Nunito', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

canvas { max-width: 100%; max-height: 100%; aspect-ratio: 16 / 9; box-shadow: 0 16px 48px rgba(0,0,0,0.75); background: #070b16; }
#controls { height: 58px; background: #101522; border-top: 1px solid #222b42; display: flex; align-items: center; gap: 12px; padding: 0 18px; font-size: 13px; }
button, select, label.btn { background: #1c2539; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; padding: 6px 12px; font-family: inherit; font-weight: 700; font-size: 12.5px; cursor: pointer; }
button:hover, select:hover, label.btn:hover { background: #283552; border-color: #ff8a3d; }
#scrub { flex: 1; accent-color: #ff8a3d; cursor: pointer; }
#readout { font-family: 'Space Mono', monospace; font-size: 12px; color: #ffb074; min-width: 230px; }
</style>
</head>
<body>
<div id="stage-wrap"><canvas id="stage" width="1920" height="1080"></canvas></div>
<div id="controls">
  <button id="playBtn">Play</button>
  <input id="scrub" type="range" min="0" max="1" step="0.001" value="0" />
  <div id="readout">00.0s / 00.0s · Shot 111</div>
  <select id="shotSelect"><option value="all">All Shots in Batch (111–120)</option></select>
  <select id="mixSelect">
    <option value="sfxOnly" selected>SFX + Ambient Only (No BGM)</option>
    <option value="mute">Mute</option>
  </select>
  <label class="btn">Load vo.wav <input id="voInput" type="file" accept="audio/*" style="display:none" /></label>
  <button id="wavBtn">Export Batch SFX (.wav)</button>
</div>
<script src="../../engine.js"></script>
<script>
const THEME = {
  CHARS: {
    HOST_PROTAG: {
      skin: '#D69A72',
      hairStyle: 'curlyCloud',
      hairColor: '#261C1A',

      mustache: false,

    BRITISH_OFFICER: {

  ANIMALS: {
    DROUGHT_BULL: {
      kind: 'bull',
      s: 0.95,
      royal: false,
      expr: 'neutral'
    }
  },

  ENVS: {
    ENV_FORT_ST_GEORGE: function(g, lt, gt, cam, heroFn) {
      DK.fivePlane(g, cam, {
        bgSky: (g) => {
          DK.mood('victorianFog')(g);
          FX.clouds(g, { seed: 111, count: 6, y: 150, h: 130, color: '#CBD5E1', a: 0.55, t: gt, speed: 9 });
        },
        bgFar: (g) => {
          FX.storybookHorizon(g, { style: 'colonial', y: 760, seed: 21 });
        },
        bgFarDepth: 0.35,
        bgFarBlur: 1.5,
        mgBack: (g) => {
          FX.structure3D(g, 360, 840, 320, 290, { kind: 'colonialHall', color: '#E2E8F0', t: gt });

        mgBackDepth: 0.72,
        mgHero: (g) => {

          FX.bokehOrbs(g, gt, { count: 10, color: 'rgba(255,210,160,0.12)' });

        fgBokehBlur: 8
      });
    },

    ENV_FAMINE_DROUGHT: function(g, lt, gt, cam, heroFn) {
      DK.fivePlane(g, cam, {
        bgSky: (g) => {
          const grad = g.createLinearGradient(0, 0, 0, 840);
          grad.addColorStop(0, '#5C2C16');
          grad.addColorStop(0.55, '#B46530');
          grad.addColorStop(1, '#E2A86B');
          g.fillStyle = grad;
          g.fillRect(0, 0, 1920, 840);
          FX.sun(g, 1520, 210, 74);
          FX.clouds(g, { seed: 112, count: 4, y: 170, h: 95, color: '#E7C496', a: 0.35, t: gt, speed: 6 });
        },
        bgFar: (g) => {
          FX.hills(g, { seed: 34, y: 760, amp: 85, color: '#8A5229' });
          FX.storybookHorizon(g, { style: 'rural', y: 775, seed: 44 });
        },
        bgFarDepth: 0.35,
        bgFarBlur: 1.5,
        mgBack: (g) => {
          FX.structure3D(g, 290, 840, 190, 175, { kind: 'thatchedHut', color: '#8C6239', t: gt });
          FX.structure3D(g, 1580, 840, 210, 185, { kind: 'brickHouse', color: '#9A5B36', t: gt });
          FX.tree(g, 520, 840, 0.9, '#6E4726', 'oak');
          FX.tree(g, 1340, 840, 0.85, '#6E4726', 'palm');
          FX.storybookGround(g, 840, { style: 'earthPath', baseCol: '#7C4D2B', grassCol: '#9C6B3B' });
          // Cracked parched earth lines
          g.save();
          g.strokeStyle = 'rgba(42, 22, 10, 0.55)';
          g.lineWidth = 2.5;
          for (let i = 0; i < 12; i++) {
            const cx = 140 + i * 150;
            g.beginPath();
            g.moveTo(cx, 855);
            g.lineTo(cx + 28, 895);
            g.lineTo(cx - 18, 945);
            g.moveTo(cx + 28, 895);
            g.lineTo(cx + 64, 925);
            g.stroke();
          }
          g.restore();
        },
        mgBackDepth: 0.72,
        mgHero: (g) => {
          if (heroFn) heroFn(g);
        },
        fgBokeh: (g) => {
          FX.bokehOrbs(g, gt, { count: 14, color: 'rgba(235, 165, 95, 0.16)' });
        },
        fgBokehDepth: 1.45,
        fgBokehBlur: 7
      });
    },

    ENV_ANCIENT_HARBOR: function(g, lt, gt, cam, heroFn) {
      DK.fivePlane(g, cam, {
        bgSky: (g) => {
          DK.mood('coastalDay')(g);
          FX.sun(g, 1460, 195, 58);
          FX.clouds(g, { seed: 113, count: 6, y: 145, h: 120, color: '#F1F5F9', a: 0.8, t: gt, speed: 12 });
        },
        bgFar: (g) => {
          FX.storybookHorizon(g, { style: 'harbor', y: 740, seed: 55 });
          FX.structure3D(g, 1420, 770, 320, 260, { kind: 'romanShip', color: '#5C3A21', t: gt });
          FX.structure3D(g, 420, 770, 260, 220, { kind: 'colonialHall', color: '#CBD5E1', t: gt });
        },
        bgFarDepth: 0.35,
        bgFarBlur: 1.5,
        mgBack: (g) => {
          FX.waterBody(g, gt, { x: 0, y: 745, w: 1920, h: 105, color: '#1E6091', waves: true });
          FX.storybookGround(g, 840, { style: 'flagstone', baseCol: '#576574', grassCol: '#475569' });
          FX.prop3D(g, 1380, 840, 0.95, { kind: 'amphoraStack', color: '#B45309', state: 'active', t: gt });
          FX.prop3D(g, 220, 840, 0.95, { kind: 'marketCanopy', color: '#991B1B', state: 'active', t: gt });
        },
        mgBackDepth: 0.72,
        mgHero: (g) => {
          if (heroFn) heroFn(g);
        },
        fgBokeh: (g) => {
          FX.bokehOrbs(g, gt, { count: 8, color: 'rgba(255,255,255,0.12)' });
        },
        fgBokehDepth: 1.45,
        fgBokehBlur: 8
      });
    },

    ENV_CREATOR_STUDIO: function(g, lt, gt, cam, heroFn) {
      FX.infographicEnv(g, gt, {
        preset: 'techStudio',
        cam: cam,
        y: 850,
        seed: 119,
        hero: (g) => {
          if (heroFn) heroFn(g);
        }
      });
    },

    ENV_JUSTICE_HALL: function(g, lt, gt, cam, heroFn) {
      FX.infographicEnv(g, gt, {
        preset: 'courtroom',
        cam: cam,
        y: 840,
        seed: 120,
        hero: (g) => {
          if (heroFn) heroFn(g);
        }
      });
    }
  },

  INFO: {
    MAP_MADRAS_PRESIDENCY: function(g, lt, gt, extraOpts) {
      const o = extraOpts || {};
      UI.strategicMap(g, lt, {
        region: 'Tamil Nadu',
        bbox: [74.5, 7.8, 84.5, 19.5],
        style: 'terrainHistorical',
        title: o.title || 'MADRAS PRESIDENCY (1801–1878 CE)',
        subTitle: o.subTitle || 'BRITISH EAST INDIA COMPANY & CROWN RULE',
        reading: o.reading || 'COLONIAL REVENUE & FAMINE SURVEY',
        territories: [
          {
            place: 'Tamil Nadu',
            color: o.territoryColor || 'rgba(220, 38, 38, 0.46)',
            border: '#FF4D6A',
            label: o.territoryLabel || 'MADRAS PRESIDENCY',
            t0: 0.1
          }
        ],
        routes: o.routes || [
          { from: [80.27, 13.08], to: [76.95, 11.01], t0: 0.2, dur: 1.4, color: '#FF4D6A' },
          { from: [80.27, 13.08], to: [78.11, 9.92], t0: 0.35, dur: 1.5, color: '#FF851B' }
        ],
        pins: o.pins || [
          { lonLat: [80.27, 13.08], label: 'FORT ST. GEORGE (MADRAS)', diorama: 'stoneFort', t0: 0.15 },
          { lonLat: [79.13, 10.78], label: 'THANJAVUR', diorama: 'gopuram', t0: 0.30 },
          { lonLat: [78.11, 9.92], label: 'MADURAI', diorama: 'pin', t0: 0.45 },
          { lonLat: [77.60, 12.97], label: 'MYSORE / DECCAN', diorama: 'pin', t0: 0.55 }
        ]
      });
    },

    CHART_FAMINE_SPIKE: function(g, lt, gt) {
      UI.chartLine(g, lt, {
        x: 1120,
        y: 470,
        w: 1080,
        h: 460,
        title: 'MADRAS PRESIDENCY FAMINE MORTALITY (*1876–1878 CE)',
        xLabels: ['1850', '1860', '1866', '*1876–78', '1880'],
        yRange: [0, 60],
        unit: 'L',
        series: [
          {
            name: 'Famine Deaths (Lakhs)',
            color: '#FF4D6A',
            area: true,
            values: [2.5, 4.0, 10.0, 55.0, 8.0]
          }
        ],
        anomalies: [
          { idx: 3, label: '*1876–1878 GREAT FAMINE (55+ LAKHS)', color: '#FF4D6A' }
        ],
        t0: 0.1,
        dur: 1.35
      });
    },

    CHART_FAMINE_COMPARISON: function(g, lt, gt, extraOpts) {
      const o = extraOpts || {};
      UI.chartBar3D(g, lt, {
        x: 1160,
        y: 485,
        w: 1020,
        h: 470,
        title: 'HISTORICAL MORTALITY COMPARISON (IN LAKHS)',
        unit: 'L',
        depth3D: 28,
        data: o.data || [
          { label: 'WWII Holocaust (1941–45)', value: 60, color: '#64748B', highlight: true }
        ],
        t0: 0.15,
        dur: 1.8
      });
    }
  },

  spawnChar: function(g, id, overrides) {
    const base = this.CHARS[id] || this.CHARS.HOST_PROTAG;
    const cfg = Object.assign({}, base, overrides || {});
    cfg.beard = false;
    cfg.mustache = false;
    DK.char(g, cfg);
  },

  drawEnv: function(id, g, lt, gt, cam, heroFn) {
    const fn = this.ENVS[id];
    if (fn) fn(g, lt, gt, cam, heroFn);
  },

  drawInfo: function(id, g, lt, gt, extraOpts) {
    const fn = this.INFO[id];
    if (fn) fn(g, lt, gt, extraOpts);
  },

  // Rule 4 Helper: Low foreground terrace at y = 980 for Map presenter scenes (Zero dirt wall covering map)
  drawMapTerrace: function(g, yTerrace) {
    const yt = yTerrace || 965;
    g.save();
    const grad = g.createLinearGradient(0, yt - 35, 0, 1080);
    grad.addColorStop(0, 'rgba(15, 23, 42, 0.88)');
    grad.addColorStop(1, 'rgba(7, 11, 22, 0.98)');
    g.fillStyle = grad;
    g.fillRect(0, yt - 25, 1920, 1080 - (yt - 25));
    g.strokeStyle = 'rgba(255, 138, 61, 0.65)';
    g.lineWidth = 3;
    g.beginPath();
    g.moveTo(0, yt - 25);
    g.lineTo(1920, yt - 25);
    g.stroke();
    g.restore();
  },

  // Rule 5 Helper: Non-destructive floating HUD Era Chapter Dial banner at y = 115..165
  hudEraDial: function(g, lt, opts) {
    const o = opts || {};
    const p = DK.pop(lt, o.t0 || 0.1, 0.45);
    const y = o.y || 125;
    g.save();
    g.translate(960, y);
    g.scale(p, p);
    g.fillStyle = 'rgba(12, 18, 34, 0.92)';
    g.strokeStyle = o.accent || '#FFB84D';
    g.lineWidth = 3;
    g.beginPath();
    g.roundRect(-390, -44, 780, 88, 16);
    g.fill();
    g.stroke();

    g.fillStyle = o.accent || '#FFB84D';
    g.font = '800 16px "Space Mono", monospace';
    g.textAlign = 'center';
    g.fillText(o.era || 'MADRAS PRESIDENCY', 0, -10);

    g.fillStyle = '#FFFFFF';
    g.font = '900 26px "Fredoka", sans-serif';
    g.fillText(o.year || '1801 CE · FULL COLONIAL RULE', 0, 24);
    g.restore();
  },

  // Rule 5 Helper: Non-destructive floating HUD Title Card banner at y = 155
  hudTitleBanner: function(g, lt, opts) {
    const o = opts || {};
    const t0 = o.t0 !== undefined ? o.t0 : 0.2;
    if (lt < t0) return;
    const p = DK.pop(lt, t0, 0.5);
    const y = o.y || 155;
    g.save();
    g.translate(960, y);
    g.scale(p, p);
    g.fillStyle = 'rgba(15, 20, 36, 0.92)';
    g.strokeStyle = o.accent || '#FF4D6A';
    g.lineWidth = 3.5;
    g.beginPath();
    g.roundRect(-470, -54, 940, 108, 18);
    g.fill();
    g.stroke();

    g.fillStyle = '#FFE4E6';
    g.font = '900 30px "Nunito", sans-serif';
    g.textAlign = 'center';
    g.fillText(o.title || 'தாது வருடப் பஞ்சம் (1876–1878)', 0, -6);

    g.fillStyle = o.accent || '#FF851B';
    g.font = '800 18px "Space Mono", monospace';
    g.fillText(o.sub || 'THE GREAT SOUTHERN INDIA FAMINE', 0, 28);
    g.restore();
  }
};

window.THEME = THEME;

const SHOTS = [
  // =========================================================================
  // BATCH 23: SHOTS 111 TO 115 (06:11.4 – 06:27.5 | 371.4s – 387.5s)
  // =========================================================================
  {
    shot_number: 111,
    title: '1801 Madras Presidency — Full British Rule',
    start: 371.4,
    end: 374.4,
    duration: 3.0,
    vo_line: 'தமிழ்நாடு பிரிட்டிஷ்காரங்களுக்கு கீழ full-ஆ போகுது.',
    env_id: 'ENV_FORT_ST_GEORGE + MAP_MADRAS_PRESIDENCY',
    chars: 'BRITISH_OFFICER (walk -> slam Carnatic Treaty 1801 seal onto desk)',
    on_screen_text: 'MADRAS PRESIDENCY · 1801 CE · FULL COLONIAL RULE',
    camera_sfx: 'Map + Low Foreground Terrace · Iron Stamp Shake at 1.50s',
    transition_id: 'DARK_FOG_DISSOLVE',
    draw: function(g, lt, gt, u) {
      const shakeY = lt > 1.45 && lt < 1.95 ? DK.shake(lt, 6, 18, 111) : 0;
      const camZ = DK.key(lt, [[0.0, 1.00], [1.50, 1.06], [3.0, 1.10]], DK.ease.outCubic);

      g.save();
      g.translate(960, 540 + shakeY);
      g.scale(camZ, camZ);
      g.translate(-960, -540);

      // Rule 4: Unobstructed Strategic Map across the canvas
      THEME.drawInfo('MAP_MADRAS_PRESIDENCY', g, lt, gt, {
        title: 'CARNATIC TREATY OF 1801 · MADRAS PRESIDENCY',
        subTitle: '31 JULY 1801 · ANNEXATION OF TAMIL NADU',
        territoryColor: lt >= 1.50 ? 'rgba(220, 38, 38, 0.58)' : 'rgba(245, 158, 11, 0.35)',
        territoryLabel: lt >= 1.50 ? 'DIRECT BRITISH CROWN / EIC RULE' : 'CARNATIC ANNEXATION'
      });

      // Low foreground terrace so presenter & desk never block the map with a dirt wall
      THEME.drawMapTerrace(g, 975);

      // Target Prop: Treaty Table at x: 950, y: 975
      FX.interactiveProp(g, { kind: 'scholarDesk', x: 950, y: 975, lt, gt });

      // Hero 1: BRITISH_OFFICER walking to x: 860 (860 + 90 = 950px target contact)
      const reach = lt >= 1.50;
      THEME.spawnChar(g, 'BRITISH_OFFICER', {
        moveX: [380, 860, lt, 1.55],
        y: 975,
        prop: 'hammer',
        pose: { preset: reach ? 'build' : 'walk', speed: 1.15 },
        t: gt
      });

      // Mid-Shot Micro-Beat (lt = 1.50s): Heavy iron wax seal stamp on the treaty & map
      if (lt >= 1.50) {
        const sp = DK.pop(lt, 1.50, 0.35);
        g.save();
        g.translate(1380, 620);
        g.scale(sp, sp);
        g.rotate(-0.12);
        g.fillStyle = 'rgba(185, 28, 28, 0.92)';
        g.strokeStyle = '#FCA5A5';
        g.lineWidth = 4;
        g.beginPath();
        g.roundRect(-210, -48, 420, 96, 12);
        g.fill();
        g.stroke();
        g.fillStyle = '#FFFFFF';
        g.font = '900 22px "Space Mono", monospace';
        g.textAlign = 'center';
        g.fillText('ANNEXED: 31 JULY 1801', 0, -6);
        g.font = '700 15px "Nunito", sans-serif';
        g.fillStyle = '#FECACA';
        g.fillText('DIRECT BRITISH ADMINISTRATION', 0, 22);
        g.restore();
      }

      g.restore();

      // Rule 5: Non-destructive floating HUD Era Chapter Dial banner
      THEME.hudEraDial(g, lt, {
        era: 'MADRAS PRESIDENCY',
        year: '1801 CE · FULL COLONIAL RULE',
        accent: lt >= 1.50 ? '#FF4D6A' : '#FFB84D',
        y: 118
      });

      UI.citation(g, 'Carnatic Treaty of 31 July 1801 · Formation of Madras Presidency', { align: 'right' });
      DK.finishFrame(g, gt, { vignette: 0.28, grain: 0.025 });
    },
    sfx: function(k, bt0) {
      k.bed('ancientHarbor', bt0 + 0.0, bt0 + 3.0, { gain: 0.18 });
      k.play('footstep', bt0 + 0.30, { gain: 0.40 });
      k.play('jailCellSlam', bt0 + 1.50, { gain: 0.68 });
      k.play('gavelBang', bt0 + 1.55, { gain: 0.58 });
    }
  },

  {
    shot_number: 112,
    title: 'Colonial Exploitation — Parched Village Suffering',
    start: 374.4,
    end: 377.2,
    duration: 2.8,
    vo_line: 'இந்த பிரிட்டிஷ் ஆட்சிக்காலம் தமிழ்நாட்டுக்கு ஒரு நரக வேதனையா இருந்துச்சு.',
    env_id: 'ENV_FAMINE_DROUGHT',
    chars: 'TAMIL_FARMER (pulling empty wooden grain cart across parched path)',
    on_screen_text: '19th CENTURY COLONIAL EXPLOITATION',
    camera_sfx: 'Slow Pan (-25 to +25) · Wind & Heavy Cart Thud at 1.40s',
    transition_id: 'CAMERA_PAN_TO_HARBOR_EXPORT',
    draw: function(g, lt, gt, u) {
      const cam = {
        x: DK.key(lt, [[0.0, -25], [2.8, 25]], DK.ease.inOutSine),
        y: 0,
        z: DK.key(lt, [[0.0, 1.00], [1.40, 1.04], [2.8, 1.07]], DK.ease.outCubic)
      };

      THEME.drawEnv('ENV_FAMINE_DROUGHT', g, lt, gt, cam, (g) => {
        const cartX = DK.lerp(265, 745, lt / 2.8);
        const charX = DK.lerp(360, 840, lt / 2.8);

        // Moving Target Prop: Empty Wooden Grain Cart + Plow at charX - 95px
        FX.interactiveProp(g, { kind: 'plowField', x: cartX, y: 840, lt, gt });

        // Wooden cart body & spoked wheel connected to farmer's hands
        g.save();

if (window.DK && DK.linkShotTransitions) DK.linkShotTransitions(SHOTS, window.THEME);
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const BATCH_START = SHOTS[0].start;
const BATCH_END = SHOTS[SHOTS.length - 1].end;
const DURATION = BATCH_END - BATCH_START;

// Auto-runs each shot's attached sfx(k, bt0) if scoreSound(k) is not defined separately
if (typeof window.scoreSound !== 'function') {
  window.scoreSound = function scoreSound(k) {
    SHOTS.forEach((s) => {
      if (typeof s.sfx === 'function') s.sfx(k, s.start - BATCH_START);
    });
  };
}
const scoreSound = window.scoreSound;

window.BATCH_START = BATCH_START;
window.BATCH_END = BATCH_END;
window.DURATION = DURATION;
window.SHOTS = SHOTS;
window.scoreSound = scoreSound;

let currentT = 0, playing = false, rafId = null, lastTs = 0, stopSound = null, activeShotFilter = 'all', voAudio = null;

function findShotAtGlobal(gt) {
  for (let i = 0; i < SHOTS.length; i++) {
    if (gt >= SHOTS[i].start && gt <= SHOTS[i].end) return SHOTS[i];
  }
  return gt < SHOTS[0].start ? SHOTS[0] : SHOTS[SHOTS.length - 1];
}

function renderAtLocal(localT) {
  currentT = DK.clamp(localT, 0, DURATION);
  const gt = BATCH_START + currentT;
  const s = findShotAtGlobal(gt);
  const lt = DK.clamp(gt - s.start, 0, s.duration);
  const u = s.duration > 0 ? lt / s.duration : 0;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, 1920, 1080);
  ctx.save();
  if (window.DK && DK.drawShot) DK.drawShot(ctx, s, lt, gt, u);
  else s.draw(ctx, lt, gt, u);
  ctx.restore();
  document.getElementById('scrub').value = DURATION > 0 ? currentT / DURATION : 0;
  document.getElementById('readout').textContent = gt.toFixed(2) + 's (' + currentT.toFixed(2) + 's) · Shot ' + s.shot_number;
}

window.seek = function (t, opts) {
  if (playing) pause();
  const localT = opts && opts.global ? t - BATCH_START : t;
  renderAtLocal(localT);
};

function startAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  const mixMode = document.getElementById('mixSelect').value;
  if (mixMode !== 'mute' && window.SOUND) stopSound = SOUND.live(scoreSound, currentT, { mixMode: 'sfxOnly' });
  if (voAudio) { voAudio.currentTime = BATCH_START + currentT; voAudio.play().catch(() => {}); }
}

function stopAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  if (voAudio) voAudio.pause();
}

function play() {
  if (playing) return;
  playing = true;
  document.getElementById('playBtn').textContent = 'Pause';
  lastTs = performance.now();
  startAudio();
  const tick = (now) => {
    if (!playing) return;
    const dt = (now - lastTs) / 1000;
    lastTs = now;
    let nextT = currentT + dt;
    if (activeShotFilter !== 'all') {
      const s = SHOTS.find((sh) => String(sh.shot_number) === activeShotFilter);
      if (s) {
        const sLocal0 = s.start - BATCH_START, sLocal1 = s.end - BATCH_START;
        if (nextT >= sLocal1) { nextT = sLocal0; currentT = nextT; startAudio(); }
      }
    } else if (nextT >= DURATION) {
      nextT = 0; currentT = 0; startAudio();
    }
    renderAtLocal(nextT);
    rafId = requestAnimationFrame(tick);
  };
  rafId = requestAnimationFrame(tick);
}

function pause() {
  playing = false;
  document.getElementById('playBtn').textContent = 'Play';
  if (rafId) cancelAnimationFrame(rafId);
  stopAudio();
}

const shotSelect = document.getElementById('shotSelect');
SHOTS.forEach((s) => {
  const opt = document.createElement('option');
  opt.value = String(s.shot_number);
  opt.textContent = 'Shot ' + s.shot_number + ': ' + s.title + ' (' + s.start.toFixed(1) + 's-' + s.end.toFixed(1) + 's)';
  shotSelect.appendChild(opt);
});

shotSelect.addEventListener('change', () => {
  activeShotFilter = shotSelect.value;
  if (activeShotFilter !== 'all') {
    const s = SHOTS.find((sh) => String(sh.shot_number) === activeShotFilter);
    if (s) { renderAtLocal(s.start - BATCH_START); if (playing) startAudio(); }
  }
});

document.getElementById('playBtn').addEventListener('click', () => (playing ? pause() : play()));
document.getElementById('scrub').addEventListener('input', (e) => {
  renderAtLocal(parseFloat(e.target.value) * DURATION);
  if (playing) startAudio();
});
document.getElementById('mixSelect').addEventListener('change', () => { if (playing) startAudio(); });
document.getElementById('voInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  voAudio = new Audio(URL.createObjectURL(file));
});
document.getElementById('wavBtn').addEventListener('click', async () => {
  const res = await SOUND.renderOffline(scoreSound, DURATION, 48000, { mixMode: 'sfxOnly' });
  const blob = SOUND.encodeWAV(res.inter, res.sr);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'batch_sfx_' + SHOTS[0].shot_number + '_' + SHOTS[SHOTS.length - 1].shot_number + '.wav';
  a.click();
});
window.addEventListener('DOMContentLoaded', async () => {
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  if (window.MAP && MAP.preloadAll) await MAP.preloadAll(SHOTS);
  renderAtLocal(0);
});
</script>
