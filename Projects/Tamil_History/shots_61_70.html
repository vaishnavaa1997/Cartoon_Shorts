<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Lumina 2.5D Storybook Studio (16:9) — Shots 61 to 70 (shots_61_70.html)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Nunito:wght@600;700;800;900&family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #05070d; color: #e2e8f0; font-family: 'Nunito', sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
#stage-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 12px; position: relative; overflow: hidden; }
canvas { max-width: 100%; max-height: 100%; aspect-ratio: 16 / 9; box-shadow: 0 16px 48px rgba(0,0,0,0.75); background: #070b16; }
#controls { height: 58px; background: #101522; border-top: 1px solid #222b42; display: flex; align-items: center; gap: 12px; padding: 0 18px; font-size: 13px; }
button, select, label.btn { background: #1c2539; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; padding: 6px 12px; font-family: inherit; font-weight: 700; font-size: 12.5px; cursor: pointer; }
button:hover, select:hover, label.btn:hover { background: #283552; border-color: #ff8a3d; }
#scrub { flex: 1; accent-color: #ff8a3d; cursor: pointer; }
#readout { font-family: 'Space Mono', monospace; font-size: 12px; color: #ffb074; min-width: 230px; }
</style>
</head>
<body>
<div id="stage-wrap"><canvas id="stage" width="1920" height="1080"></canvas></div>
<div id="controls">
  <button id="playBtn">Play</button>
  <input id="scrub" type="range" min="0" max="1" step="0.001" value="0" />
  <div id="readout">00.0s / 00.0s · Shot 61</div>
  <select id="shotSelect"><option value="all">All Shots in Batch (61–70)</option></select>
  <select id="mixSelect">
    <option value="sfxOnly" selected>SFX + Ambient Only (No BGM)</option>
    <option value="mute">Mute</option>
  </select>
  <label class="btn">Load vo.wav <input id="voInput" type="file" accept="audio/*" style="display:none" /></label>
  <button id="wavBtn">Export Batch SFX (.wav)</button>
</div>
<script src="../../engine.js"></script>
<script>
const THEME = {
  CHARS: {
    PERUNTHACHAN: {
      skin: '#C88C68',
      hairStyle: 'scholarBun',
      hairColor: '#788092',
      wardrobe: 'ancientTamil',
      topColor: '#D98238',
      bottomColor: '#F4EFE6',
      headwear: 'turban',
      foreheadMark: 'vibhuti',
      beard: false,
      mustache: false,
      s: 1.0
    },
    RAJARAJA_CHOLA: {
      skin: '#C88C68',
      hairStyle: 'royalBun',
      hairColor: '#1A1615',
      wardrobe: 'ancientTamil',
      topColor: '#F7B928',
      bottomColor: '#B8332A',
      headwear: 'crown',
      foreheadMark: 'tilak',
      beard: false,
      mustache: false,
      s: 1.06
    },
    RAJENDRA_CHOLA: {
      skin: '#C88C68',
      hairStyle: 'warriorKnot',
      hairColor: '#1A1615',
      wardrobe: 'ancientTamil',
      topColor: '#E63946',
      bottomColor: '#F7B928',
      headwear: 'crown',
      foreheadMark: 'vibhuti',
      beard: false,
      mustache: false,
      s: 1.06
    },
    KEELADI_MASON: {
      skin: '#7A4E38',
      hairStyle: 'warriorKnot',
      hairColor: '#1A1615',
      wardrobe: 'ancientTamil',
      topColor: '#C87D55',
      bottomColor: '#E8DFD1',
      headwear: 'none',
      foreheadMark: 'vibhuti',
      beard: false,
      mustache: false,
      s: 1.0
    },
    TAMIL_FARMER: {
      skin: '#7A4E38',
      hairStyle: 'shortCrop',
      hairColor: '#261C1A',
      wardrobe: 'ancientTamil',
      topColor: '#5A8F68',
      bottomColor: '#F4EFE6',
      headwear: 'turban',
      foreheadMark: 'vibhuti',
      beard: false,
      mustache: false,
      s: 0.98
    },
    HOST_SWEATER: {
      skin: '#D69A72',
      hairStyle: 'curlyCloud',
      hairColor: '#261C1A',
      wardrobe: 'sweater',
      topColor: '#FF851B',
      bottomColor: '#1E293B',
      headwear: 'none',
      foreheadMark: null,
      beard: false,
      mustache: false,
      s: 1.0
    },
    HOST_SCIENTIST: {
      skin: '#D69A72',
      hairStyle: 'curlyCloud',
      hairColor: '#261C1A',
      wardrobe: 'scientist',
      topColor: '#F8FAFC',
      bottomColor: '#334155',
      headwear: 'none',
      foreheadMark: null,
      beard: false,
      mustache: false,
      s: 1.0
    }
  },

  ANIMALS: {
    WORK_ELEPHANT: {
      kind: 'elephant',
      s: 1.15,
      royal: true,
      expr: 'neutral'
    }
  },

  drawChar(id, g, opts = {}) {
    const base = this.CHARS[id] || this.CHARS.HOST_SWEATER;
    DK.char(g, Object.assign({}, base, opts, { beard: false, mustache: false }));
  },

  drawAnimal(id, g, opts = {}) {
    const base = this.ANIMALS[id] || this.ANIMALS.WORK_ELEPHANT;
    DK.animal(g, Object.assign({}, base, opts));
  },

  drawFloatingEraDial(g, lt, opts = {}) {
    const era = opts.era || 'CHOLA EMPIRE';
    const year = opts.year || '1014 – 1044 CE';
    const x = opts.x || 960;
    const y = opts.y || 128;
    const pop = DK.pop(lt, opts.t0 || 0.15, 0.45);
    g.save();
    g.translate(x, y);
    g.scale(pop, pop);

    g.fillStyle = 'rgba(12, 18, 34, 0.92)';
    g.strokeStyle = '#F7B928';
    g.lineWidth = 3;
    g.beginPath();
    g.roundRect(-330, -44, 660, 88, 44);
    g.fill();
    g.stroke();

    g.strokeStyle = 'rgba(247, 185, 40, 0.35)';
    g.lineWidth = 1.5;
    g.beginPath();
    g.roundRect(-318, -34, 636, 68, 34);
    g.stroke();

    // Rotating golden sun-wheel emblem on left
    g.save();
    g.translate(-265, 0);
    g.rotate(lt * 0.8);
    g.strokeStyle = '#F7B928';
    g.lineWidth = 2.5;
    g.beginPath();
    g.arc(0, 0, 22, 0, Math.PI * 2);
    g.stroke();
    for (let i = 0; i < 8; i++) {
      const a = (i * Math.PI) / 4;
      g.beginPath();
      g.moveTo(Math.cos(a) * 10, Math.sin(a) * 10);
      g.lineTo(Math.cos(a) * 26, Math.sin(a) * 26);
      g.stroke();
    }
    g.restore();

    g.textAlign = 'center';
    g.fillStyle = '#FFD54F';
    g.font = '800 15px "Space Mono", monospace';
    g.fillText('ERA CHRONICLE // ' + year, 25, -8);

    g.fillStyle = '#FFFFFF';
    g.font = '900 24px "Fredoka", sans-serif';
    g.fillText(era, 25, 22);
    g.restore();
  },

  ENVS: {
    ENV_THANJAVUR_VIMANA(g, lt, gt, cam, heroFn) {
      DK.fivePlane(g, cam, {
        bgSky: (g) => {
          DK.mood('clearDay')(g);
          FX.sun(g, 1540, 190, 62);
          FX.godRays(g, 1540, 190, { count: 7, a: 0.16 });
          FX.clouds(g, { seed: 61, count: 6, y: 140, h: 130, color: '#FFFFFF', a: 0.88, t: gt, speed: 10 });
        },
        bgFar: (g) => {
          FX.storybookHorizon(g, { style: 'ancientTamil', y: 760, seed: 61 });
          FX.tree(g, 210, 760, 0.85, '#3E7A4E', 'palm');
          FX.tree(g, 1710, 760, 0.9, '#3E7A4E', 'palm');
        },
        bgFarDepth: 0.35,
        bgFarBlur: 1.5,
        mgBack: (g) => {
          FX.storybookScene(g, gt, { preset: 'templeCourtyard', y: 840, seed: 61 });
          FX.structure3D(g, 230, 840, 210, 220, { kind: 'mandapam', color: '#C89B6E', t: gt });
          FX.structure3D(g, 1690, 840, 210, 220, { kind: 'mandapam', color: '#C89B6E', t: gt });
        },
        mgBackDepth: 0.72,
        mgHero: (g) => {
          FX.storybookGround(g, 840, { style: 'flagstone', baseCol: '#B68F68', grassCol: '#4A8C4A' });
          if (heroFn) heroFn(g);
        },
        fgBokeh: (g) => {
          FX.bokehOrbs(g, gt, { count: 10, color: 'rgba(255, 215, 130, 0.16)' });
        },
        fgBokehDepth: 1.45,
        fgBokehBlur: 8
      });
    },

    ENV_GRANITE_HAUL_ROAD(g, lt, gt, cam, heroFn) {
      DK.fivePlane(g, cam, {
        bgSky: (g) => {
          DK.mood('clearDay')(g);
          FX.sun(g, 1480, 195, 58);
          FX.clouds(g, { seed: 62, count: 7, y: 145, h: 135, color: '#FFFFFF', a: 0.9, t: gt, speed: 12 });
        },
        bgFar: (g) => {
          // Flat alluvial Kaveri delta horizon with zero granite hills
          g.fillStyle = '#7BB668';
          g.fillRect(0, 710, 1920, 130);
          FX.waterBody(g, gt, { x: 0, y: 742, w: 1920, h: 42, color: '#3898EC', waves: true });
          FX.tree(g, 180, 740, 0.75, '#3E7A4E', 'palm');
          FX.tree(g, 520, 740, 0.7, '#3E7A4E', 'palm');
          FX.tree(g, 1390, 740, 0.75, '#3E7A4E', 'palm');
          FX.tree(g, 1730, 740, 0.8, '#3E7A4E', 'palm');
        },
        bgFarDepth: 0.35,
        bgFarBlur: 1.5,
        mgBack: (g) => {
          FX.storybookScene(g, gt, { preset: 'farmClearing', y: 840, seed: 62 });
          FX.tree(g, 280, 840, 0.95, '#3D7A47', 'palm');
          FX.tree(g, 1650, 840, 1.0, '#3D7A47', 'banyan');
        },
        mgBackDepth: 0.72,
        mgHero: (g) => {
          FX.storybookGround(g, 840, { style: 'earthPath', baseCol: '#8C6747', grassCol: '#4E944F' });
          if (heroFn) heroFn(g);
        },
        fgBokeh: (g) => {
          FX.bokehOrbs(g, gt, { count: 8, color: 'rgba(255, 235, 175, 0.14)' });
        },
        fgBokehDepth: 1.45,
        fgBokehBlur: 8
      });
    },

    ENV_CREATOR_STUDIO(g, lt, gt, cam, heroFn) {
      FX.infographicEnv(g, gt, {
        preset: 'techStudio',
        cam: cam,
        y: 840,
        seed: 67,
        hero: heroFn
      });
    },

    ENV_ANCIENT_HARBOR(g, lt, gt, cam, heroFn) {
      FX.infographicEnv(g, gt, {
        preset: 'ancientHarbor',
        cam: cam,
        y: 840,
        seed: 70,
        hero: (g) => {
          FX.waterBody(g, gt, { x: 0, y: 760, w: 1920, h: 90, color: '#1E6BA8', waves: true });
          FX.structure3D(g, 340, 790, 260, 220, { kind: 'cholaShip', color: '#8C5230', t: gt });
          FX.structure3D(g, 1480, 795, 280, 235, { kind: 'cholaShip', color: '#7A4628', t: gt });
          if (heroFn) heroFn(g);
        }
      });
    }
  },

  INFO: {
    SCALE_BIG_TEMPLE(g, lt, gt) {
      // Render monumental Brihadeeswarar Vimana (66m) at x: 960, y: 840
      FX.structure3D(g, 960, 840, 320, 560, { kind: 'gopuram', color: '#C87A42', t: gt });

      // Octagonal 80-tonne Sikharam dome & golden Kalasam finial
      g.save();
      g.fillStyle = '#B86830';
      g.strokeStyle = '#5A2E14';
      g.lineWidth = 3;
      g.beginPath();
      g.roundRect(890, 260, 140, 44, 16);
      g.fill();
      g.stroke();

      // Golden Kalasam spire
      g.fillStyle = '#F7B928';
      g.beginPath();
      g.moveTo(960, 212);
      g.lineTo(976, 260);
      g.lineTo(944, 260);
      g.closePath();
      g.fill();
      g.restore();

      // Scale comparison items on left platform
      if (UI.scaleComparison) {
        g.save();
        g.translate(-340, 0);
        UI.scaleComparison(g, lt, {
          x: 680,
          y: 840,
          camZoom: 1.0,
          grid: false,
          items: [
            { label: 'HUMAN (1.75m)', heightM: 1.75, kind: 'char', color: '#5CE1FF' },
            { label: 'ELEPHANT (3.2m)', heightM: 3.2, kind: 'elephant', color: '#F7B928' },
            { label: 'VIMANA (66m)', heightM: 66, kind: 'gopuram', color: '#FF851B' }
          ],
          t: gt
        });
        g.restore();
      }
    },

    TEARDOWN_CHOLA_INTERLOCK(g, lt, gt, opts = {}) {
      const explode = opts.explode !== undefined ? opts.explode : 0.5;
      // Subtle architectural blueprint backdrop card so the courtyard stays visible around it
      g.save();
      g.fillStyle = 'rgba(11, 18, 34, 0.84)';
      g.strokeStyle = 'rgba(92, 225, 255, 0.45)';
      g.lineWidth = 2.5;
      g.beginPath();
      g.roundRect(410, 210, 1100, 560, 22);
      g.fill();
      g.stroke();
      g.restore();

      UI.explodedAssembly(g, lt, {
        x: 960,
        y: 520,
        s: 1.08,
        explode: explode,
        isolateIdx: null,
        layers: [
          {
            id: 'base_plinth',
            label: 'UPAPITHA GRANITE BASE',
            subText: 'Precision Mortise Grooves · 0.0mm Mortar',
            w: 420,
            d: 250,
            h: 48,
            color: '#8E765E',
            detail: 'grid'
          },
          {
            id: 'middle_course',
            label: 'ADHISHTHANA INTERLOCK COURSE',
            subText: 'Dovetail & Tenon Stone Keying',
            w: 390,
            d: 230,
            h: 46,
            color: '#AD9174',
            detail: 'grid'
          },
          {
            id: 'upper_vimana',
            label: 'HOLLOW-CORE VIMANA COURSE',
            subText: 'Pure Gravity Axial Load Lock',
            w: 360,
            d: 210,
            h: 44,
            color: '#C9AD8E',
            detail: 'grid'
          }
        ]
      });

      // Draw visible dovetail/tenon stone interlock teeth between the layers
      const gap = explode * 95;
      g.save();
      for (let i = -1; i <= 1; i++) {
        const tx = 960 + i * 95;
        // Tenon pegs protruding from upper/middle courses
        g.fillStyle = '#D9B99B';
        g.strokeStyle = '#4A3B2C';
        g.lineWidth = 2;
        g.fillRect(tx - 18, 500 - gap * 0.45, 36, 18);
        g.strokeRect(tx - 18, 500 - gap * 0.45, 36, 18);
        g.fillRect(tx - 18, 565 + gap * 0.45, 36, 18);
        g.strokeRect(tx - 18, 565 + gap * 0.45, 36, 18);
      }
      g.restore();
    }
  },

  drawInfo(id, g, lt, gt, opts = {}) {
    if (this.INFO[id]) this.INFO[id](g, lt, gt, opts);
  }
};
window.THEME = THEME;

const SHOTS = [
  // =========================================================================
  // BATCH 13: SHOTS 061 TO 065 (204.8s – 219.9s)
  // =========================================================================
  {
    shot_number: 61,
    title: 'Scale Arena: Thanjavur Brihadeeswarar Temple (66m / 216 ft)',
    start: 204.8,
    end: 207.3,
    duration: 2.5,
    vo_line: 'தஞ்சை பெரிய கோயிலும் ராஜராஜ சோழன் கட்டுனதுதான்.',
    env_id: 'ENV_THANJAVUR_VIMANA + SCALE_BIG_TEMPLE',
    chars: 'PERUNTHACHAN (walk [420->865]), RAJARAJA_CHOLA (admire at 1055)',
    on_screen_text: 'BRIHADEESWARAR TEMPLE (தஞ்சை பெரிய கோயில் · 1010 CE) · 66 METERS (216 FT)',
    camera_sfx: 'cam.y [+12 -> -12], z: 1.04 · templeBell, ding, conchShell',
    transition_out: 'CAMERA_PULL_TO_FLAT_PLAINS',
    draw(g, lt, gt, u) {
      const cam = {
        x: 0,
        y: DK.key(lt, [[0, 12], [2.5, -12]], DK.ease.outCubic),
        z: 1.04
      };

      THEME.ENVS.ENV_THANJAVUR_VIMANA(g, lt, gt, cam, (g) => {
        // Monumental Brihadeeswarar Vimana & Scale Comparison
        THEME.drawInfo('SCALE_BIG_TEMPLE', g, lt, gt);

        // Chief Architect Kunjaramallan Rajaraja Perunthachan walking up to the temple plinth (charX + 95px at arrival)
        THEME.drawChar('PERUNTHACHAN', g, {
          moveX: [420, 865, lt, 2.5],
          y: 840,
          pose: { preset: 'walk', speed: 1.15 },
          prop: 'scroll',
          eyeMode: 'warm',
          mouth: 'smile',
          t: gt,
          seed: 61
        });

        // Emperor Rajaraja Chola I admiring the Vimana on the right of the plinth (charX - 95px from plinth)
        THEME.drawChar('RAJARAJA_CHOLA', g, {
          x: 1055,
          y: 840,
          flipX: true,
          pose: { preset: 'admire', speed: 1.0 },
          prop: 'vel',
          eyeMode: 'warm',
          mouth: 'smile',
          t: gt,
          seed: 62
        });

        // Mid-Shot Micro-Beat (lt = 1.25s): Vertical laser dimension line locks at 66 METERS (216 FT)
        const dimP = DK.prog(lt, 0.3, 1.25);
        const topY = DK.lerp(840, 215, DK.ease.outCubic(dimP));
        g.save();
        g.strokeStyle = lt >= 1.25 ? '#FF851B' : '#5CE1FF';
        g.lineWidth = 3.5;
        g.setLineDash([8, 6]);
        g.beginPath();
        g.moveTo(1185, 840);
        g.lineTo(1185, topY);
        g.stroke();
        g.setLineDash([]);

        // Horizontal ticks
        g.beginPath();
        g.moveTo(1165, 840);
        g.lineTo(1205, 840);
        g.moveTo(1165, topY);
        g.lineTo(1205, topY);
        g.stroke();

        if (lt >= 1.25) {
          const pop = DK.pop(lt, 1.25, 0.35);
          g.translate(1420, 420);
          g.scale(pop, pop);
          g.fillStyle = 'rgba(15, 23, 42, 0.94)';
          g.strokeStyle = '#FF851B';
          g.lineWidth = 3;
          g.beginPath();
          g.roundRect(-210, -42, 420, 84, 14);
          g.fill();
          g.stroke();
          g.fillStyle = '#FFD54F';
          g.font = '800 15px "Space Mono", monospace';
          g.textAlign = 'center';
          g.fillText('SRIVIMANA HEIGHT LOCK', 0, -10);
          g.fillStyle = '#FFFFFF';
          g.font = '900 21px "Nunito", sans-serif';
          g.fillText('66 METERS (216 FT) · 1010 CE', 0, 20);
        }
        g.restore();
      });

      UI.pillBadge(g, lt, {
        text: 'BRIHADEESWARAR TEMPLE (தஞ்சை பெரிய கோயில் · 1010 CE)',
        x: 960,
        y: 115,
        accent: '#FF851B',
        t0: 0.2
      });
      UI.citation(g, 'UNESCO Great Living Chola Temples · Built 1003–1010 CE', { align: 'right' });
      DK.finishFrame(g, gt, { vignette: 0.26, grain: 0.02 });
    },
    sfx(k, bt0) {
      k.bed('templeCourtyard', bt0 + 0.0, bt0 + 2.5, { gain: 0.22 });
      k.play('templeBell', bt0 + 0.20, { gain: 0.58 });
      k.play('ding', bt0 + 1.25, { gain: 0.52 });
      k.play('conchShell', bt0 + 1.50, { gain: 0.50 });
    }
  },

  {
    shot_number: 62,
    title: 'Zero Mountains or Granite Quarries Around Thanjavur',
    start: 207.3,
    end: 209.8,
    duration: 2.5,
    vo_line: 'அந்த time-ல தஞ்சாவூரை சுத்தி எந்த மலையும் பாறையும் கிடையாது.',
    env_id: 'ENV_GRANITE_HAUL_ROAD',
    chars: 'PERUNTHACHAN (walk [520->880], prop: telescope, survey post at 970)',
    on_screen_text: 'ALLUVIAL KAVERI DELTA · ZERO LOCAL GRANITE QUARRIES · 0 GRANITE HILLS WITHIN 50 KM',
    camera_sfx: 'cam.x [-28 -> +28], z: 1.02 · footstep, submarineSonar, whoosh',
    transition_out: 'WHIP_PAN_TO_QUARRY_ROAD',
    draw(g, lt, gt, u) {
      const cam = {
        x: DK.key(lt, [[0, -28], [2.5, 28]], DK.ease.inOutSine),
        y: 0,
        z: 1.02
      };

      THEME.ENVS.ENV_GRANITE_HAUL_ROAD(g, lt, gt, cam, (g) => {
        // Survey post / table at x: 970 (charX + 90px at arrival)
        FX.interactiveProp(g, { kind: 'scholarDesk', x: 970, y: 840, lt, gt });

        // Chief Architect Perunthachan walking up and scanning the flat delta horizon
        THEME.drawChar('PERUNTHACHAN', g, {
          moveX: [520, 880, lt, 2.5],
          y: 840,
          pose: { preset: 'walk', speed: 1.15 },
          prop: 'telescope',
          brows: lt >= 1.25 ? 'raised' : 'neutral',
          mouth: lt >= 1.25 ? 'o' : 'neutral',
          t: gt,
          seed: 62
        });

        // Mid-Shot Micro-Beat (lt = 1.25s): Radar scan sweeps across flat delta & flashes '0 GRANITE HILLS WITHIN 50 KM'
        if (lt >= 1.0) {
          const scanP = DK.prog(lt, 1.0, 2.2);
          const radius = DK.lerp(40, 680, scanP);
          g.save();
          g.strokeStyle = 'rgba(255, 77, 106, ' + (1 - scanP * 0.65).toFixed(2) + ')';
          g.lineWidth = 4;
          g.beginPath();
          g.ellipse(970, 790, radius, radius * 0.22, 0, 0, Math.PI * 2);
          g.stroke();

          if (lt >= 1.25) {
            const pop = DK.pop(lt, 1.25, 0.35);
            g.translate(970, 490);
            g.scale(pop, pop);

if (window.DK && DK.linkShotTransitions) DK.linkShotTransitions(SHOTS, window.THEME);
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const BATCH_START = SHOTS[0].start;
const BATCH_END = SHOTS[SHOTS.length - 1].end;
const DURATION = BATCH_END - BATCH_START;

// Auto-runs each shot's attached sfx(k, bt0) if scoreSound(k) is not defined separately
if (typeof window.scoreSound !== 'function') {
  window.scoreSound = function scoreSound(k) {
    SHOTS.forEach((s) => {
      if (typeof s.sfx === 'function') s.sfx(k, s.start - BATCH_START);
    });
  };
}
const scoreSound = window.scoreSound;

window.BATCH_START = BATCH_START;
window.BATCH_END = BATCH_END;
window.DURATION = DURATION;
window.SHOTS = SHOTS;
window.scoreSound = scoreSound;

let currentT = 0, playing = false, rafId = null, lastTs = 0, stopSound = null, activeShotFilter = 'all', voAudio = null;

function findShotAtGlobal(gt) {
  for (let i = 0; i < SHOTS.length; i++) {
    if (gt >= SHOTS[i].start && gt <= SHOTS[i].end) return SHOTS[i];
  }
  return gt < SHOTS[0].start ? SHOTS[0] : SHOTS[SHOTS.length - 1];
}

function renderAtLocal(localT) {
  currentT = DK.clamp(localT, 0, DURATION);
  const gt = BATCH_START + currentT;
  const s = findShotAtGlobal(gt);
  const lt = DK.clamp(gt - s.start, 0, s.duration);
  const u = s.duration > 0 ? lt / s.duration : 0;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, 1920, 1080);
  ctx.save();
  if (window.DK && DK.drawShot) DK.drawShot(ctx, s, lt, gt, u);
  else s.draw(ctx, lt, gt, u);
  ctx.restore();
  document.getElementById('scrub').value = DURATION > 0 ? currentT / DURATION : 0;
  document.getElementById('readout').textContent = gt.toFixed(2) + 's (' + currentT.toFixed(2) + 's) · Shot ' + s.shot_number;
}

window.seek = function (t, opts) {
  if (playing) pause();
  const localT = opts && opts.global ? t - BATCH_START : t;
  renderAtLocal(localT);
};

function startAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  const mixMode = document.getElementById('mixSelect').value;
  if (mixMode !== 'mute' && window.SOUND) stopSound = SOUND.live(scoreSound, currentT, { mixMode: 'sfxOnly' });
  if (voAudio) { voAudio.currentTime = BATCH_START + currentT; voAudio.play().catch(() => {}); }
}

function stopAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  if (voAudio) voAudio.pause();
}

function play() {
  if (playing) return;
  playing = true;
  document.getElementById('playBtn').textContent = 'Pause';
  lastTs = performance.now();
  startAudio();
  const tick = (now) => {
    if (!playing) return;
    const dt = (now - lastTs) / 1000;
    lastTs = now;
    let nextT = currentT + dt;
    if (activeShotFilter !== 'all') {
      const s = SHOTS.find((sh) => String(sh.shot_number) === activeShotFilter);
      if (s) {
        const sLocal0 = s.start - BATCH_START, sLocal1 = s.end - BATCH_START;
        if (nextT >= sLocal1) { nextT = sLocal0; currentT = nextT; startAudio(); }
      }
    } else if (nextT >= DURATION) {
      nextT = 0; currentT = 0; startAudio();
    }
    renderAtLocal(nextT);
    rafId = requestAnimationFrame(tick);
  };
  rafId = requestAnimationFrame(tick);
}

function pause() {
  playing = false;
  document.getElementById('playBtn').textContent = 'Play';
  if (rafId) cancelAnimationFrame(rafId);
  stopAudio();
}

const shotSelect = document.getElementById('shotSelect');
SHOTS.forEach((s) => {
  const opt = document.createElement('option');
  opt.value = String(s.shot_number);
  opt.textContent = 'Shot ' + s.shot_number + ': ' + s.title + ' (' + s.start.toFixed(1) + 's-' + s.end.toFixed(1) + 's)';
  shotSelect.appendChild(opt);
});

shotSelect.addEventListener('change', () => {
  activeShotFilter = shotSelect.value;
  if (activeShotFilter !== 'all') {
    const s = SHOTS.find((sh) => String(sh.shot_number) === activeShotFilter);
    if (s) { renderAtLocal(s.start - BATCH_START); if (playing) startAudio(); }
  }
});

document.getElementById('playBtn').addEventListener('click', () => (playing ? pause() : play()));
document.getElementById('scrub').addEventListener('input', (e) => {
  renderAtLocal(parseFloat(e.target.value) * DURATION);
  if (playing) startAudio();
});
document.getElementById('mixSelect').addEventListener('change', () => { if (playing) startAudio(); });
document.getElementById('voInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  voAudio = new Audio(URL.createObjectURL(file));
});
document.getElementById('wavBtn').addEventListener('click', async () => {
  const res = await SOUND.renderOffline(scoreSound, DURATION, 48000, { mixMode: 'sfxOnly' });
  const blob = SOUND.encodeWAV(res.inter, res.sr);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'batch_sfx_' + SHOTS[0].shot_number + '_' + SHOTS[SHOTS.length - 1].shot_number + '.wav';
  a.click();
});
window.addEventListener('DOMContentLoaded', async () => {
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  if (window.MAP && MAP.preloadAll) await MAP.preloadAll(SHOTS);
  renderAtLocal(0);
});
</script>
