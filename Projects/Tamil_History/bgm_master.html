  const div = document.createElement('div');
  div.className = 'cue-card';
  div.id = 'cue-card-' + idx;
  const dna = window.SOUND && SOUND.analyzeCueDNA ? SOUND.analyzeCueDNA(c) : {};
  const sit = c.situation || c.mood || c.archetype || 'CUSTOM_SCORE';
  const scaleStr = dna.scaleName || c.scale || 'dorian';
  const progStr = dna.progName || c.progression || 'kurzgesagtDorian';
  const leadStr = dna.leadVoice || c.lead || 'kalimbaMarimba';
  const padStr = dna.padVoice || c.pad || 'analogPad';
  const percStr = dna.percStyle || c.perc || 'cinematic';
  const tens = dna.tension !== undefined ? Math.round(dna.tension * 100) + '%' : '50%';
  const val = dna.valence !== undefined ? (dna.valence >= 0 ? '+' + dna.valence.toFixed(2) : dna.valence.toFixed(2)) : '0.0';
  div.innerHTML =
    '<div>' +
      '<div class="cue-title">' + c.cue_id + ' (' + (c.shots || '') + ') · ' + sit + ' — ' + (c.desc || '') + '</div>' +
      '<div class="cue-sub">Scale: ' + scaleStr + ' (' + (dna.key || c.key || 'D Minor') + ') · Prog: ' + progStr + ' · Voices: [' + leadStr + ' + ' + padStr + ' + ' + percStr + '] · Tension: ' + tens + ' · Valence: ' + val + ' · BPM: ' + (dna.bpm || c.bpm || 108) + '</div>' +
    '</div>' +
    '<div class="badge">' + c.start_time.toFixed(1) + 's – ' + c.end_time.toFixed(1) + 's</div>';
  cueListEl.appendChild(div);
});

function findCueAt(t) {
  for (let i = 0; i < BGM_SCORE.cues.length; i++) {
    const c = BGM_SCORE.cues[i];
    if (t >= c.start_time && t <= c.end_time) return { c, idx: i };
  }
  return { c: BGM_SCORE.cues[0], idx: 0 };
}

function updateUI(t) {
  currentT = DK.clamp(t, 0, DURATION);
  document.getElementById('scrub').value = DURATION > 0 ? currentT / DURATION : 0;
  const active = findCueAt(currentT);
  document.getElementById('readout').textContent = currentT.toFixed(2) + 's / ' + DURATION.toFixed(2) + 's · ' + (active.c ? active.c.cue_id : '');
  BGM_SCORE.cues.forEach((_, idx) => {
    const el = document.getElementById('cue-card-' + idx);
    if (el) el.classList.toggle('active', idx === active.idx);
  });
}

function startAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  const mixMode = document.getElementById('bgmMixSelect').value;
  stopSound = SOUND.live(scoreBGM, currentT, { mixMode });
  if (voAudio) { voAudio.currentTime = currentT; voAudio.play().catch(() => {}); }
}

function stopAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  if (voAudio) voAudio.pause();
}

function play() {
  if (playing) return;
  playing = true;
  document.getElementById('playBtn').textContent = 'Pause';
  lastTs = performance.now();
  startAudio();
  const tick = (now) => {
    if (!playing) return;
    const dt = (now - lastTs) / 1000;
    lastTs = now;
    let nextT = currentT + dt;
    if (nextT >= DURATION) { nextT = 0; currentT = 0; startAudio(); }
    updateUI(nextT);
    rafId = requestAnimationFrame(tick);
  };
  rafId = requestAnimationFrame(tick);
}

function pause() {
  playing = false;
  document.getElementById('playBtn').textContent = 'Play Master BGM';
  if (rafId) cancelAnimationFrame(rafId);
  stopAudio();
}

document.getElementById('playBtn').addEventListener('click', () => (playing ? pause() : play()));
document.getElementById('scrub').addEventListener('input', (e) => {
  updateUI(parseFloat(e.target.value) * DURATION);
  if (playing) startAudio();
});
document.getElementById('bgmMixSelect').addEventListener('change', () => { if (playing) startAudio(); });
document.getElementById('voInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  voAudio = new Audio(URL.createObjectURL(file));
});
document.getElementById('exportBtn').addEventListener('click', async () => {
  const btn = document.getElementById('exportBtn');
  btn.textContent = 'Rendering bgm_master.wav...';
  const mixMode = document.getElementById('bgmMixSelect').value;
  const res = await SOUND.renderOffline(scoreBGM, DURATION, 48000, { mixMode });
  const blob = SOUND.encodeWAV(res.inter, res.sr);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'bgm_master.wav';
  a.click();
  btn.textContent = 'Export bgm_master.wav';
});
</script>
</body>
</html>
