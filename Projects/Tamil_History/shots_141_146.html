// ============================================================================
// NON-DESTRUCTIVE FLOATING HUD OVERLAY ENFORCERS (RULE 5 COMPLIANCE)
// Guarantees UI.eraChapterDial, UI.horizonChapterDial & UI.titleCard NEVER paint
// a full-screen background over a DK.fivePlane scene, rendering strictly at y = 110..175
// ============================================================================
(function enforceNonDestructiveHUD() {
  if (!window.UI) window.UI = {};

  function drawRoundedBanner(g, x, y, w, h, r, fillStyle, strokeStyle, lineWidth) {
    g.save();
    g.beginPath();
    if (g.roundRect) {
      g.roundRect(x - w * 0.5, y - h * 0.5, w, h, r);
    } else {
      g.rect(x - w * 0.5, y - h * 0.5, w, h);
    }
    if (fillStyle) { g.fillStyle = fillStyle; g.fill(); }
    if (strokeStyle) { g.lineWidth = lineWidth || 2; g.strokeStyle = strokeStyle; g.stroke(); }
    g.restore();
  }

  window.UI.eraChapterDial = function(g, lt, opts) {
    opts = opts || {};
    const t0 = opts.t0 !== undefined ? opts.t0 : 0.0;
    const sweepT = opts.sweepT !== undefined ? opts.sweepT : 1.35;
    const enterP = DK.clamp((lt - t0) / 0.45, 0, 1);
    if (enterP <= 0) return;

    const cy = DK.clamp(opts.y || 135, 110, 175);
    const cx = opts.x || 960;
    const w = opts.w || 920;
    const h = 88;
    const sweepProg = DK.clamp((lt - sweepT) / 0.85, 0, 1);

    g.save();
    g.globalAlpha = enterP;
    g.translate(cx, cy - (1 - enterP) * 18);

    // Floating glassmorphic heritage HUD banner
    const grad = g.createLinearGradient(-w * 0.5, -h * 0.5, w * 0.5, h * 0.5);
    grad.addColorStop(0, 'rgba(15, 23, 42, 0.90)');
    grad.addColorStop(0.5, 'rgba(30, 22, 16, 0.94)');
    grad.addColorStop(1, 'rgba(15, 23, 42, 0.90)');
    drawRoundedBanner(g, 0, 0, w, h, 18, grad, '#F7B928', 2.5);

    // Inner golden trim & dial ticks
    drawRoundedBanner(g, 0, 0, w - 12, h - 12, 13, null, 'rgba(255, 213, 79, 0.32)', 1.2);
    for (let i = -10; i <= 10; i++) {
      const tx = i * 38 + (sweepProg * 24) % 38;
      const isMajor = i % 5 === 0;
      g.strokeStyle = isMajor ? 'rgba(247, 185, 40, 0.55)' : 'rgba(226, 232, 240, 0.20)';
      g.lineWidth = isMajor ? 2 : 1;
      g.beginPath();
      g.moveTo(tx, h * 0.5 - (isMajor ? 14 : 9));
      g.lineTo(tx, h * 0.5 - 3);
      g.stroke();
    }

    // Sweep highlight bar at mid-shot micro-beat
    if (sweepProg > 0) {
      const barW = (w - 40) * sweepProg;
      g.fillStyle = 'rgba(247, 185, 40, 0.16)';
      g.fillRect(-w * 0.5 + 20, -h * 0.5 + 8, barW, h - 16);
    }

    // Era Title
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.font = '800 22px "Fredoka", "Nunito", sans-serif';
    g.fillStyle = '#FFD54F';
    g.fillText(opts.era || '4,200+ YEARS OF TAMIL CIVILIZATION', 0, -14);

    // Year Span Subtitle
    g.font = '700 16px "Space Mono", monospace';
    g.fillStyle = sweepProg > 0.1 ? '#5CE1FF' : '#F8FAFC';
    g.fillText(opts.year || '2172 BCE – 2026 CE', 0, 16);

    g.restore();
  };

  window.UI.horizonChapterDial = window.UI.eraChapterDial;

  window.UI.titleCard = function(g, lt, opts) {
    opts = opts || {};
    const t0 = opts.t0 !== undefined ? opts.t0 : 0.0;
    const enterP = DK.clamp((lt - t0) / 0.45, 0, 1);
    if (enterP <= 0) return;

    const cy = DK.clamp(opts.y || 155, 110, 175);
    const cx = opts.x || 960;
    const w = opts.w || 980;
    const h = 98;

    g.save();
    g.globalAlpha = enterP;
    const scalePop = 0.94 + 0.06 * Math.sin(enterP * Math.PI * 0.5);
    g.translate(cx, cy);
    g.scale(scalePop, scalePop);

    const grad = g.createLinearGradient(-w * 0.5, -h * 0.5, w * 0.5, h * 0.5);
    grad.addColorStop(0, 'rgba(13, 18, 32, 0.92)');
    grad.addColorStop(0.5, 'rgba(38, 25, 15, 0.95)');
    grad.addColorStop(1, 'rgba(13, 18, 32, 0.92)');
    drawRoundedBanner(g, 0, 0, w, h, 20, grad, '#FF851B', 2.8);
    drawRoundedBanner(g, 0, 0, w - 14, h - 14, 15, null, 'rgba(255, 213, 79, 0.40)', 1.2);

    // Decorative side diamonds
    g.fillStyle = '#FFD54F';
    [-w * 0.5 + 34, w * 0.5 - 34].forEach((dx) => {
      g.beginPath();
      g.moveTo(dx, -8);
      g.lineTo(dx + 8, 0);
      g.lineTo(dx, 8);
      g.lineTo(dx - 8, 0);
      g.closePath();
      g.fill();
    });

    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.font = '900 28px "Fredoka", "Nunito", sans-serif';
    g.fillStyle = '#FFFFFF';
    g.shadowColor = 'rgba(255, 133, 27, 0.55)';
    g.shadowBlur = 12;
    g.fillText(opts.title || 'தமிழ்நாடு · HISTORY AWAITS', 0, -14);

    g.shadowBlur = 0;
    g.font = '800 16px "Space Mono", "Nunito", monospace';
    g.fillStyle = '#FFD54F';
    g.fillText(opts.sub || '4,200 YEARS & COUNTING', 0, 20);

    g.restore();
  };
})();

    if (gt >= SHOTS[i].start && gt <= SHOTS[i].end) return SHOTS[i];
  }
  return gt < SHOTS[0].start ? SHOTS[0] : SHOTS[SHOTS.length - 1];
}

function renderAtLocal(localT) {
  currentT = DK.clamp(localT, 0, DURATION);
  const gt = BATCH_START + currentT;
  const s = findShotAtGlobal(gt);
  const lt = DK.clamp(gt - s.start, 0, s.duration);
  const u = s.duration > 0 ? lt / s.duration : 0;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, 1920, 1080);
  ctx.save();
  if (window.DK && DK.drawShot) DK.drawShot(ctx, s, lt, gt, u);
  else s.draw(ctx, lt, gt, u);
  ctx.restore();
  document.getElementById('scrub').value = DURATION > 0 ? currentT / DURATION : 0;
  document.getElementById('readout').textContent = gt.toFixed(2) + 's (' + currentT.toFixed(2) + 's) · Shot ' + s.shot_number;
}

window.seek = function (t, opts) {
  if (playing) pause();
  const localT = opts && opts.global ? t - BATCH_START : t;
  renderAtLocal(localT);
};

function startAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  const mixMode = document.getElementById('mixSelect').value;
  if (mixMode !== 'mute' && window.SOUND) stopSound = SOUND.live(scoreSound, currentT, { mixMode: 'sfxOnly' });
  if (voAudio) { voAudio.currentTime = BATCH_START + currentT; voAudio.play().catch(() => {}); }
}

function stopAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  if (voAudio) voAudio.pause();
}

function play() {
  if (playing) return;
  playing = true;
  document.getElementById('playBtn').textContent = 'Pause';
  lastTs = performance.now();
  startAudio();
  const tick = (now) => {
    if (!playing) return;
    const dt = (now - lastTs) / 1000;
    lastTs = now;
    let nextT = currentT + dt;
    if (activeShotFilter !== 'all') {
      const s = SHOTS.find((sh) => String(sh.shot_number) === activeShotFilter);
      if (s) {
        const sLocal0 = s.start - BATCH_START, sLocal1 = s.end - BATCH_START;
        if (nextT >= sLocal1) { nextT = sLocal0; currentT = nextT; startAudio(); }
      }
    } else if (nextT >= DURATION) {
      nextT = 0; currentT = 0; startAudio();
    }
    renderAtLocal(nextT);
    rafId = requestAnimationFrame(tick);
  };
  rafId = requestAnimationFrame(tick);
}

function pause() {
  playing = false;
  document.getElementById('playBtn').textContent = 'Play';
  if (rafId) cancelAnimationFrame(rafId);
  stopAudio();
}

const shotSelect = document.getElementById('shotSelect');
SHOTS.forEach((s) => {
  const opt = document.createElement('option');
  opt.value = String(s.shot_number);
  opt.textContent = 'Shot ' + s.shot_number + ': ' + s.title + ' (' + s.start.toFixed(1) + 's-' + s.end.toFixed(1) + 's)';
  shotSelect.appendChild(opt);
});

shotSelect.addEventListener('change', () => {
  activeShotFilter = shotSelect.value;
  if (activeShotFilter !== 'all') {
    const s = SHOTS.find((sh) => String(sh.shot_number) === activeShotFilter);
    if (s) { renderAtLocal(s.start - BATCH_START); if (playing) startAudio(); }
  }
});

document.getElementById('playBtn').addEventListener('click', () => (playing ? pause() : play()));
document.getElementById('scrub').addEventListener('input', (e) => {
  renderAtLocal(parseFloat(e.target.value) * DURATION);
  if (playing) startAudio();
});
document.getElementById('mixSelect').addEventListener('change', () => { if (playing) startAudio(); });
document.getElementById('voInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  voAudio = new Audio(URL.createObjectURL(file));
});
document.getElementById('wavBtn').addEventListener('click', async () => {
  const res = await SOUND.renderOffline(scoreSound, DURATION, 48000, { mixMode: 'sfxOnly' });
  const blob = SOUND.encodeWAV(res.inter, res.sr);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'batch_sfx_' + SHOTS[0].shot_number + '_' + SHOTS[SHOTS.length - 1].shot_number + '.wav';
  a.click();
});
window.addEventListener('DOMContentLoaded', async () => {
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  if (window.MAP && MAP.preloadAll) await MAP.preloadAll(SHOTS);
  renderAtLocal(0);
});
</script>
</body>
</html>
