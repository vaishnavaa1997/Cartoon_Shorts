  {

    end: 167.0,

    vo_line: 'ஒரு சின்ன உளி தப்பா பட்டு கல் உடைஞ்சாலும் ஒட்டுமொத்த கோயிலும் waste.',
    env_id: 'ENV_MAMALLAPURAM_SHORE + PHY_OOPS_MONOLITH',
    chars: 'HOST_PROTAG (x: 740) + PALLAVA_SCULPTOR (moveX: 1320 -> 1060)',
    on_screen_text: 'ZERO MARGIN FOR ERROR · NO "CTRL+Z" IN 650 CE!',
    camera_sfx: 'cam shake at 1.1s · anvilStrike + shatter + recordScratch + sadTrombone',
    transition_id: 'SNAP_BACK_TO_REALITY',
    draw(g, lt, gt, u) {
      const shk = lt > 1.1 ? DK.shake(lt - 1.1, 10, 20, 49) : { x: 0, y: 0 };
      const cam = {
        x: shk.x,
        y: shk.y * 0.5,
        z: 1.06
      };
      THEME.ENVS.ENV_MAMALLAPURAM_SHORE(g, gt, cam, (g) => {
        // Pre-baked 120Hz Voronoi/Stone Shatter Monolith at x: 850, y: 840 (charX + 110px from Host at 740)
        PHY.shatterWall(g, lt, THEME.INFO.PHY_OOPS_MONOLITH.opts);

        // Clumsy Apprentice (HOST_PROTAG) striking the monolith at x: 740
        DK.char(g, {
          ...THEME.CHARS.HOST_PROTAG,
          x: 740,
          y: 840,
          prop: 'hammer',
          eyeMode: lt >= 1.10 ? 'panic' : 'warm',
          brows: lt >= 1.10 ? 'raised' : 'neutral',
          mouth: lt >= 1.10 ? 'scream' : 'smile',
          pose: { preset: 'build', speed: 1.4 },
          t: gt,
          seed: 54
        });

        // Horrified Master Sculptor walking in and freezing in shock at x: 1060
        DK.char(g, {
          ...THEME.CHARS.PALLAVA_SCULPTOR,
          moveX: [1320, 1060, lt, 2.6],
          y: 840,
          flipX: true,
          eyeMode: lt >= 1.10 ? 'wince' : 'warm',
          brows: 'furrowed',
          mouth: lt >= 1.10 ? 'gasp' : 'neutral',
          pose: { preset: 'walk', speed: 1.1 },
          t: gt,
          seed: 55
        });

        // Comedic floating "OOPS! NO CTRL+Z!" callout bubble after impactTime 1.10s
        if (lt >= 1.15) {
          const popS = DK.pop(lt, 1.15, 0.25);
          g.save();
          g.translate(650, 610);
          g.scale(popS, popS);
          g.fillStyle = '#FF4D6A';
          g.fillRect(-105, -24, 210, 44);
          g.font = '900 16px "Space Mono", monospace';
          g.fillStyle = '#FFFFFF';
          g.textAlign = 'center';
          g.fillText('OOPS! 100% WASTE!', 0, 4);
          g.restore();
        }
      });

      UI.pillBadge(g, lt, {
        text: 'ZERO MARGIN FOR ERROR · NO "CTRL+Z" IN 650 CE!',
        x: 960,
        y: 120,
        accent: '#FF4D6A',
        t0: 1.15
      });
      UI.citation(g, 'Unfinished Pancha Rathas & Pidari Rathas Monoliths, Mamallapuram', { align: 'right' });
      DK.finishFrame(g, gt, { vignette: 0.28, grain: 0.025 });
    },
    sfx(k, bt0) {
      k.bed('ancientHarbor', bt0 + 0.0, bt0 + 1.1, { gain: 0.18 });
      k.play('anvilStrike', bt0 + 1.05, { gain: 0.65 });
      k.play('shatter', bt0 + 1.10, { gain: 0.75 });
      k.play('recordScratch', bt0 + 1.15, { gain: 0.48 });
      k.play('sadTrombone', bt0 + 1.45, { gain: 0.45 });
      if (window.PHY && PHY.scheduleImpacts) {
        PHY.scheduleImpacts(k, 'shatter', THEME.INFO.PHY_OOPS_MONOLITH.opts, 164.4, BATCH_START);
      }
    }
  },

  // =========================================================================
  // SHOT 050 · [02:47.0 - 02:49.6] (167.0s – 169.6s, dur: 2.6s)
  // Millimeter-Perfect Monolithic Precision
  // =========================================================================
  {
    shot_number: 50,
    title: 'Millimeter-Perfect Monolithic Precision',
    start: 167.0,
    end: 169.6,
    duration: 2.6,
    vo_line: 'அந்த அளவுக்கு ஒரு துல்லியத்தோட வேலை செஞ்சிருக்காங்க.',
    env_id: 'ENV_MAMALLAPURAM_SHORE (Arjuna’s Penance Bas-Relief)',
    chars: 'PALLAVA_SCULPTOR (x: 680) + ROYAL_ELEPHANT (moveX: 1360 -> 1040)',
    on_screen_text: 'MILLIMETER-PERFECT MONOLITHIC PRECISION',
    camera_sfx: 'cam z: 1.0 -> 1.06 · pillBadge + starShimmer + elephantTrumpet',
    transition_id: 'CAMERA_PAN_TO_SEA_MAP',
    draw(g, lt, gt, u) {
      const cam = {
        x: 0,
        y: 0,
        z: DK.key(lt, [[0, 1.0], [2.6, 1.06]], DK.ease.outCubic)
      };
      THEME.ENVS.ENV_MAMALLAPURAM_SHORE(g, gt, cam, (g) => {
        // Monumental Arjuna's Penance / Descent of the Ganges Bas-Relief Wall (29m x 13m)
        g.save();
        g.fillStyle = '#B89F80';
        g.strokeStyle = '#5C4D3C';
        g.lineWidth = 4;
        g.fillRect(745, 490, 420, 350);
        g.strokeRect(745, 490, 420, 350);
        // Central sacred cleft & carved relief panels
        g.fillStyle = '#7E6A52';
        g.fillRect(940, 490, 28, 350);
        g.strokeStyle = '#8F795E';
        g.lineWidth = 2.5;
        g.strokeRect(770, 520, 150, 140);
        g.strokeRect(985, 520, 155, 140);
        g.strokeRect(770, 680, 150, 130);
        g.strokeRect(985, 680, 155, 130);

        // Mid-Shot Micro-Beat (lt = 1.30s): Golden precision caliper lines flash over the relief
        if (lt >= 1.30) {
          const calA = DK.clamp((lt - 1.30) / 0.35, 0, 1);
          g.globalAlpha = calA;
          g.strokeStyle = '#FFD54F';
          g.lineWidth = 2.2;
          g.setLineDash([6, 4]);
          g.strokeRect(760, 510, 390, 310);
          g.beginPath();
          g.moveTo(760, 665);
          g.lineTo(1150, 665);
          g.moveTo(954, 510);
          g.lineTo(954, 820);
          g.stroke();
          g.setLineDash([]);
          g.fillStyle = '#0F172A';
          g.fillRect(835, 445, 240, 34);
          g.strokeStyle = '#FFD54F';
          g.strokeRect(835, 445, 240, 34);
          g.font = '800 14px "Space Mono", monospace';
          g.fillStyle = '#FFD54F';
          g.textAlign = 'center';
          g.fillText('TOLERANCE: ±1.0mm GRANITE', 955, 467);
        }
        g.restore();

        // Target Interactive Prop at x: 765 (charX + 85px exact contact from Sculptor at 680)
        FX.interactiveProp(g, { kind: 'brickWallBuild', x: 765, y: 840, cutTime: 99, lt, gt });

        // Master Sculptor polishing the carved stone surface
        DK.char(g, {
          ...THEME.CHARS.PALLAVA_SCULPTOR,
          x: 680,
          y: 840,
          prop: 'quill',
          eyeMode: 'happyArch',
          mouth: 'smile',
          pose: { preset: 'build', speed: 1.15 },
          t: gt,
          seed: 56
        });

        // Royal Elephant walking forward in salute (moveX: 1360 -> 1040, facing left)
        DK.animal(g, {
          ...THEME.ANIMALS.ROYAL_ELEPHANT,
          moveX: [1360, 1040, lt, 2.6],
          y: 840,
          flipX: true,
          expr: 'happy',
          t: gt
        });
      });

      UI.pillBadge(g, lt, {
        text: 'MILLIMETER-PERFECT MONOLITHIC PRECISION',
        x: 960,
        y: 120,
        accent: '#38C878',
        t0: 0.25
      });
      UI.citation(g, 'Arjuna’s Penance / Descent of the Ganges Bas-Relief (29m × 13m)', { align: 'left' });
      DK.finishFrame(g, gt, { vignette: 0.26, grain: 0.02 });
    },
    sfx(k, bt0) {
      k.bed('ancientHarbor', bt0 + 0.0, bt0 + 2.6, { gain: 0.22 });
      k.play('pillBadge', bt0 + 0.25, { gain: 0.42 });
      k.play('starShimmer', bt0 + 1.30, { gain: 0.55 });
      k.play('elephantTrumpet', bt0 + 1.65, { gain: 0.48 });
    }
  }
];

if (window.DK && DK.linkShotTransitions) DK.linkShotTransitions(SHOTS, window.THEME);
const canvas = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const BATCH_START = SHOTS[0].start;
const BATCH_END = SHOTS[SHOTS.length - 1].end;
const DURATION = BATCH_END - BATCH_START;

// Auto-runs each shot's attached sfx(k, bt0) if scoreSound(k) is not defined separately
if (typeof window.scoreSound !== 'function') {
  window.scoreSound = function scoreSound(k) {
    SHOTS.forEach((s) => {
      if (typeof s.sfx === 'function') s.sfx(k, s.start - BATCH_START);
    });
  };
}
const scoreSound = window.scoreSound;

window.BATCH_START = BATCH_START;
window.BATCH_END = BATCH_END;
window.DURATION = DURATION;
window.SHOTS = SHOTS;
window.scoreSound = scoreSound;

let currentT = 0, playing = false, rafId = null, lastTs = 0, stopSound = null, activeShotFilter = 'all', voAudio = null;

function findShotAtGlobal(gt) {
  for (let i = 0; i < SHOTS.length; i++) {
    if (gt >= SHOTS[i].start && gt <= SHOTS[i].end) return SHOTS[i];
  }
  return gt < SHOTS[0].start ? SHOTS[0] : SHOTS[SHOTS.length - 1];
}

function renderAtLocal(localT) {
  currentT = DK.clamp(localT, 0, DURATION);
  const gt = BATCH_START + currentT;
  const s = findShotAtGlobal(gt);
  const lt = DK.clamp(gt - s.start, 0, s.duration);
  const u = s.duration > 0 ? lt / s.duration : 0;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, 1920, 1080);
  ctx.save();
  if (window.DK && DK.drawShot) DK.drawShot(ctx, s, lt, gt, u);
  else s.draw(ctx, lt, gt, u);
  ctx.restore();
  document.getElementById('scrub').value = DURATION > 0 ? currentT / DURATION : 0;
  document.getElementById('readout').textContent = gt.toFixed(2) + 's (' + currentT.toFixed(2) + 's) · Shot ' + s.shot_number;
}

window.seek = function (t, opts) {
  if (playing) pause();
  const localT = opts && opts.global ? t - BATCH_START : t;
  renderAtLocal(localT);
};

function startAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  const mixMode = document.getElementById('mixSelect').value;
  if (mixMode !== 'mute' && window.SOUND) stopSound = SOUND.live(scoreSound, currentT, { mixMode: 'sfxOnly' });
  if (voAudio) { voAudio.currentTime = BATCH_START + currentT; voAudio.play().catch(() => {}); }
}

function stopAudio() {
  if (stopSound) { stopSound(); stopSound = null; }
  if (voAudio) voAudio.pause();
}

function play() {
  if (playing) return;
  playing = true;
  document.getElementById('playBtn').textContent = 'Pause';
  lastTs = performance.now();
  startAudio();
  const tick = (now) => {
    if (!playing) return;
    const dt = (now - lastTs) / 1000;
    lastTs = now;
    let nextT = currentT + dt;
    if (activeShotFilter !== 'all') {
      const s = SHOTS.find((sh) => String(sh.shot_number) === activeShotFilter);
      if (s) {
        const sLocal0 = s.start - BATCH_START, sLocal1 = s.end - BATCH_START;
        if (nextT >= sLocal1) { nextT = sLocal0; currentT = nextT; startAudio(); }
      }
    } else if (nextT >= DURATION) {
      nextT = 0; currentT = 0; startAudio();
    }
    renderAtLocal(nextT);
    rafId = requestAnimationFrame(tick);
  };
  rafId = requestAnimationFrame(tick);
}

function pause() {
  playing = false;
  document.getElementById('playBtn').textContent = 'Play';
  if (rafId) cancelAnimationFrame(rafId);
  stopAudio();
}

const shotSelect = document.getElementById('shotSelect');
SHOTS.forEach((s) => {
  const opt = document.createElement('option');
  opt.value = String(s.shot_number);
  opt.textContent = 'Shot ' + s.shot_number + ': ' + s.title + ' (' + s.start.toFixed(1) + 's-' + s.end.toFixed(1) + 's)';
  shotSelect.appendChild(opt);
});

shotSelect.addEventListener('change', () => {
  activeShotFilter = shotSelect.value;
  if (activeShotFilter !== 'all') {
    const s = SHOTS.find((sh) => String(sh.shot_number) === activeShotFilter);
    if (s) { renderAtLocal(s.start - BATCH_START); if (playing) startAudio(); }
  }
});

document.getElementById('playBtn').addEventListener('click', () => (playing ? pause() : play()));
document.getElementById('scrub').addEventListener('input', (e) => {
  renderAtLocal(parseFloat(e.target.value) * DURATION);
  if (playing) startAudio();
});
document.getElementById('mixSelect').addEventListener('change', () => { if (playing) startAudio(); });
document.getElementById('voInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  voAudio = new Audio(URL.createObjectURL(file));
});
document.getElementById('wavBtn').addEventListener('click', async () => {
  const res = await SOUND.renderOffline(scoreSound, DURATION, 48000, { mixMode: 'sfxOnly' });
  const blob = SOUND.encodeWAV(res.inter, res.sr);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'batch_sfx_' + SHOTS[0].shot_number + '_' + SHOTS[SHOTS.length - 1].shot_number + '.wav';
  a.click();
});
window.addEventListener('DOMContentLoaded', async () => {
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  if (window.MAP && MAP.preloadAll) await MAP.preloadAll(SHOTS);
  renderAtLocal(0);
});
</script>
</body>
